# Supply-chain rules (docs/dependencies.md). Run: cargo deny check
[graph]
all-features = true

[advisories]
version = 2
db-path = "~/.cargo/advisory-dbs"
yanked = "deny"

[licenses]
version = 2
# The allowed set from docs/dependencies.md; a subset of FreeSpeak's deny.toml.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    # The bundled Remedy fonts (remedy-ui-fonts).
    "OFL-1.1",
]
confidence-threshold = 0.8
# The list is the policy; not every license on it is in use yet.
unused-allowed-license = "allow"

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
