# Supply-chain rules (docs/dependencies.md). Run: cargo deny check
[graph]
all-features = true
# The platforms RemedyUI ships on: dependencies are judged as they are built there, so a
# crate's code for a platform we never build it on (such as a Linux-only crate's Windows
# backend) is not counted.
targets = [
    "x86_64-pc-windows-msvc",
    "aarch64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "aarch64-linux-android",
    "x86_64-linux-android",
    # Browser pages (bridge-web).
    "wasm32-unknown-unknown",
]

[advisories]
version = 2
db-path = "~/.cargo/advisory-dbs"
yanked = "deny"
# AccessKit's Linux adapter (accesskit_unix 0.24, through atspi 0.29) is still on the zbus 5
# line, whose name/variant crates are marked unmaintained since zbus 6 merged them. These are
# maintenance notices, not vulnerabilities; RemedyUI's own D-Bus code uses zbus 6. Remove
# these exceptions when AccessKit moves to zbus 6.
ignore = [
    { id = "RUSTSEC-2026-0370", reason = "zvariant 5 via accesskit_unix; maintenance notice only" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names 4 via accesskit_unix; maintenance notice only" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive 5 via accesskit_unix; maintenance notice only" },
    # syntect 5.3 (doc-code's grammars, the latest release) reads its bundled grammar dump
    # with bincode 1 and grammar files with yaml-rust. Maintenance notices, not vulnerabilities;
    # remove when syntect moves off them.
    { id = "RUSTSEC-2025-0141", reason = "bincode 1 via syntect (grammar dumps); maintenance notice only" },
    { id = "RUSTSEC-2024-0320", reason = "yaml-rust via syntect (grammar files); maintenance notice only" },
    # Rhai 1.27 (script-rhai, the latest release) depends on smartstring, archived in 2026, even
    # with its compact_str feature. A maintenance notice, not a vulnerability; remove when Rhai
    # drops it.
    { id = "RUSTSEC-2026-0249", reason = "smartstring via rhai; maintenance notice only" },
    # rmcp 3.11 (the official MCP SDK, the latest release) depends on chrono for protocol
    # timestamps, and enables schemars' chrono support. A maintenance notice, not a
    # vulnerability, in remedy-mcp only, a developer tool no app links; remove when rmcp
    # moves off chrono.
    { id = "RUSTSEC-2026-0543", reason = "chrono via rmcp (remedy-mcp only); maintenance notice only" },
]

[licenses]
version = 2
# The allowed set from docs/dependencies.md; a subset of FreeSpeak's deny.toml.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    # Boost: permissive, no attribution needed in binaries (arboard's Windows backend).
    "BSL-1.0",
    # The bundled Remedy fonts (remedy-ui-fonts).
    "OFL-1.1",
]
confidence-threshold = 0.8
# The list is the policy; not every license on it is in use yet.
unused-allowed-license = "allow"
# The graph joins every target's edges, so with the browser target listed, the updater's TLS
# verifier (built only natively) shows its wasm32 edge to Mozilla's root certificates as data.
# RemedyUI never builds that edge: the updater has no HTTPS in a page. CDLA-Permissive-2.0 is a
# permissive data license; this exception is for that one crate only.
exceptions = [
    { allow = ["CDLA-Permissive-2.0"], crate = "webpki-root-certs" },
    # Rhai's hash seeds come from const-random, whose build-time macro hashes with tiny-keccak:
    # CC0-1.0, a public-domain dedication, in a proc macro that runs while building and is not
    # linked into apps. This exception is for that one crate only.
    { allow = ["CC0-1.0"], crate = "tiny-keccak" },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Dev-dependencies on the facade are path-only (cargo package drops them), because the facade
# depends on these crates and a versioned dev-dependency would make publishing circular.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# The owner's wgpu fork (damage-only presents), pinned to one commit by the workspace's
# [patch.crates-io] until the change is released. No other git source is allowed.
allow-git = ["https://github.com/AhmiDarrow/wgpu"]
