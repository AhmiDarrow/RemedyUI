[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "1.0.0-rc.1"
edition = "2024"
rust-version = "1.96"
license = "MIT OR Apache-2.0"
repository = "https://github.com/AhmiDarrow/RemedyUI"
authors = ["Ahmi Darrow"]
readme = "README.md"
keywords = ["gui", "ui", "widgets", "remedy", "retained"]
categories = ["gui"]

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

# The script interpreters (Rhai, wasmi) meter every step, and Rhai recurses on the native
# stack; their limits are sized from that. They are built optimized in development too, so
# tests see the stack use and speed the limits are measured for, and wasmi without its debug
# checks so it runs the same interpreter loop as in release.
[profile.dev.package.rhai]
opt-level = 3

[profile.dev.package.wasmi]
opt-level = 3
debug-assertions = false
overflow-checks = false

[profile.dev.package.wasmi_core]
opt-level = 3
debug-assertions = false
overflow-checks = false

[profile.dev.package.wasmi_ir]
opt-level = 3
debug-assertions = false
overflow-checks = false

[profile.release]
overflow-checks = true

# shortcut: wgpu with present-with-damage plus kept surface contents and buffer age, ported to
