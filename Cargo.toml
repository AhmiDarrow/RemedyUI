[workspace]
resolver = "3"
members = ["crates/*", "xtask"]
exclude = ["vendor/vello_cpu"]

[workspace.package]
version = "1.1.1"
edition = "2024"
rust-version = "1.96"
license = "MIT OR Apache-2.0"
repository = "https://github.com/AhmiDarrow/RemedyUI"
authors = ["Ahmi Darrow"]
readme = "README.md"
keywords = ["gui", "ui", "widgets", "remedy", "retained"]
categories = ["gui"]

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }

[workspace.lints.clippy]
# A crate merged into another keeps its files: `tree/mod.rs` still declares `mod tree`.
module_inception = "allow"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

# The script interpreters (RemedyLua, wasmi) meter every step. They are built optimized in
# development too, so tests see the speed the limits are measured for, and wasmi without its
# debug checks so it runs the same interpreter loop as in release.
[profile.dev.package.remedy-lua]
opt-level = 3

[profile.dev.package.wasmi]
opt-level = 3
debug-assertions = false
overflow-checks = false

[profile.dev.package.wasmi_core]
opt-level = 3
debug-assertions = false
overflow-checks = false

[profile.dev.package.wasmi_ir]
opt-level = 3
debug-assertions = false
overflow-checks = false

[profile.release]
overflow-checks = true
