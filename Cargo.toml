[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "1.0.0-rc.1"
edition = "2024"
rust-version = "1.96"
license = "MIT OR Apache-2.0"
repository = "https://github.com/AhmiDarrow/RemedyUI"
authors = ["Ahmi Darrow"]
readme = "README.md"
keywords = ["gui", "ui", "widgets", "remedy", "retained"]
categories = ["gui"]

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

# The script interpreters (Rhai, wasmi) meter every step, and Rhai recurses on the native
# stack; their limits are sized from that. They are built optimized in development too, so
# tests see the stack use and speed the limits are measured for, and wasmi without its debug
# checks so it runs the same interpreter loop as in release.
[profile.dev.package.rhai]
opt-level = 3

[profile.dev.package.wasmi]
opt-level = 3
debug-assertions = false
overflow-checks = false

[profile.dev.package.wasmi_core]
opt-level = 3
debug-assertions = false
overflow-checks = false

[profile.dev.package.wasmi_ir]
opt-level = 3
debug-assertions = false
overflow-checks = false

[profile.release]
overflow-checks = true

# shortcut: a local wgpu checkout with present-with-damage (preserved surface contents, buffer
# age, damaged present); points at crates.io wgpu once the change is released upstream.
[patch.crates-io]
wgpu = { path = "../../../../wgpu/wgpu" }
wgpu-core = { path = "../../../../wgpu/wgpu-core" }
wgpu-hal = { path = "../../../../wgpu/wgpu-hal" }
wgpu-types = { path = "../../../../wgpu/wgpu-types" }
wgpu-naga-bridge = { path = "../../../../wgpu/wgpu-naga-bridge" }
naga = { path = "../../../../wgpu/naga" }
naga-types = { path = "../../../../wgpu/naga-types" }
wgpu-core-deps-apple = { path = "../../../../wgpu/wgpu-core/platform-deps/apple" }
wgpu-core-deps-emscripten = { path = "../../../../wgpu/wgpu-core/platform-deps/emscripten" }
wgpu-core-deps-wasm = { path = "../../../../wgpu/wgpu-core/platform-deps/wasm" }
wgpu-core-deps-windows-linux-android = { path = "../../../../wgpu/wgpu-core/platform-deps/windows-linux-android" }
