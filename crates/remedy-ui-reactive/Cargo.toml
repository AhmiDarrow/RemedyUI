[package]
name = "remedy-ui-reactive"
description = "RemedyUI reactive state: glitch-free signals, memos, effects, scopes, batching, a cross-thread waker and reactive vectors."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
## Persisted signals (`Signal::persist`): values saved as JSON in the app's data folder.
## In a browser page, values are kept in the page's `localStorage` (`PersistStore::local_storage`).
persist = ["dep:serde", "dep:serde_json", "dep:wasm-bindgen", "dep:web-sys"]

[dependencies]
remedy-ui-core = { path = "../remedy-ui-core", version = "1.0.0-rc.1" }
serde = { version = "=1.0.229", optional = true }
serde_json = { version = "=1.0.154", optional = true }
stacker = "=0.1.25"

# A browser page keeps persisted values in its `localStorage`.
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
wasm-bindgen = { version = "=0.2.130", optional = true }
web-sys = { version = "=0.3.107", optional = true, features = ["DomException", "Storage", "Window"] }

[dev-dependencies]
remedy-ui-reactive = { path = ".", features = ["persist"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154" }

[lints]
workspace = true
