[package]
name = "remedy-ui-widgets-music"
description = "RemedyUI music widgets: fretboard, chord diagram, tab staff and note staff, drawn on the canvas, keyboard operable and described to screen readers."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
remedy-ui-core = { path = "../remedy-ui-core", version = "1.0.0-rc.1" }
remedy-ui-paint = { path = "../remedy-ui-paint", version = "1.0.0-rc.1" }
remedy-ui-view = { path = "../remedy-ui-view", version = "1.0.0-rc.1" }
remedy-ui-widgets-core = { path = "../remedy-ui-widgets-core", version = "1.0.0-rc.1" }

[dev-dependencies]
remedy-ui-compositor = { path = "../remedy-ui-compositor", version = "1.0.0-rc.1" }
remedy-ui-devtools = { path = "../remedy-ui-devtools", version = "1.0.0-rc.1" }
remedy-ui-fonts = { path = "../remedy-ui-fonts", version = "1.0.0-rc.1", features = ["remedy-sans-ui"] }
remedy-ui-render-cpu = { path = "../remedy-ui-render-cpu", version = "1.0.0-rc.1" }
remedy-ui-text = { path = "../remedy-ui-text", version = "1.0.0-rc.1" }
remedy-ui-themes = { path = "../remedy-ui-themes", version = "1.0.0-rc.1" }

