[package]
name = "remedy-ui-services-i18n"
description = "RemedyUI localization: Fluent message files with plurals and selectors, locale fallback, user overrides of every string, and live reload when message files change."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
fluent-bundle = "=0.16.0"
fluent-langneg = "=0.13.1"
fluent-syntax = "=0.12.0"
serde_json = "=1.0.154"
remedy-ui-core = { path = "../remedy-ui-core", version = "1.0.0-rc.1" }
remedy-ui-reactive = { path = "../remedy-ui-reactive", version = "1.0.0-rc.1" }
remedy-ui-view = { path = "../remedy-ui-view", version = "1.0.0-rc.1" }
unic-langid = { version = "=0.9.6", features = ["likelysubtags"] }

icu_calendar = { version = "=2.3.0", default-features = false, features = ["compiled_data"] }
icu_datetime = { version = "=2.3.0", default-features = false, features = ["compiled_data"] }
# `unstable` is the compact formatter (1.2K), version pinned exactly.
icu_decimal = { version = "=2.3.0", default-features = false, features = ["compiled_data", "unstable"] }
icu_locale_core = { version = "=2.4.0", default-features = false }
intl-memoizer = "=0.5.3"
# `unstable` is the display names (`language-names`), version pinned exactly.
icu_locale = { version = "=2.3.1", default-features = false, features = ["compiled_data", "unstable"], optional = true }
writeable = { version = "=0.6.4", optional = true }

[features]
## Every CLDR language's name in every CLDR locale for `language_name` (ICU4X display
## names). Without it, names come from the engine's messages: its shipped languages only.
language-names = ["dep:icu_locale", "dep:writeable"]

[dev-dependencies]
remedy-ui-fonts = { path = "../remedy-ui-fonts", version = "1.0.0-rc.1", features = ["remedy-sans-ui"] }
remedy-ui-style = { path = "../remedy-ui-style", version = "1.0.0-rc.1" }
remedy-ui-text = { path = "../remedy-ui-text", version = "1.0.0-rc.1" }
remedy-ui-core = { path = "../remedy-ui-core", version = "1.0.0-rc.1" }

[lints]
workspace = true
