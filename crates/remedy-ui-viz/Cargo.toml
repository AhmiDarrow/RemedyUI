[package]
name = "remedy-ui-viz"
description = "RemedyUI live audio visuals: the speaking ring, level meters with peak hold and a draggable threshold, sparklines and bar groups. They repaint only when their data changes and stay accessible."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
remedy-ui-core = { path = "../remedy-ui-core", version = "1.0.0-rc.1" }
remedy-ui-engine = { path = "../remedy-ui-engine", version = "1.0.0-rc.1", features = ["paint", "view"] }

[dev-dependencies]
remedy-ui-engine = { path = "../remedy-ui-engine", version = "1.0.0-rc.1", features = ["compositor", "render-cpu"] }
remedy-ui-devtools = { path = "../remedy-ui-devtools", version = "1.0.0-rc.1" }
remedy-ui-fonts = { path = "../remedy-ui-fonts", version = "1.0.0-rc.1", features = ["remedy-sans-ui"] }
remedy-ui-core = { path = "../remedy-ui-core", version = "1.0.0-rc.1" }
remedy-ui-text = { path = "../remedy-ui-text", version = "1.0.0-rc.1" }
remedy-ui-themes = { path = "../remedy-ui-themes", version = "1.0.0-rc.1" }

[lints]
workspace = true
