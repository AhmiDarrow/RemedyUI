[package]
name = "remedy-ui-media-effects"
description = "Prism effects as elements: an .rfx effect drawn by the GPU kernel or the CPU renderer, whichever draws the window, under the window's ambient policy, with a still frame and a quality ladder."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = ["gpu"]
# Effects in windows the GPU renderer draws run on the GPU kernel.
gpu = ["dep:remedy-ui-render-gpu"]

[dependencies]
remedy-ui-core = { path = "../remedy-ui-core", version = "1.0.0-rc.1" }
remedy-ui-effects = { path = "../remedy-ui-effects", version = "1.0.0-rc.1" }
remedy-ui-paint = { path = "../remedy-ui-paint", version = "1.0.0-rc.1" }
remedy-ui-render-gpu = { path = "../remedy-ui-render-gpu", version = "1.0.0-rc.1", optional = true }
remedy-ui-view = { path = "../remedy-ui-view", version = "1.0.0-rc.1" }

[dev-dependencies]
remedy-ui-compositor = { path = "../remedy-ui-compositor", version = "1.0.0-rc.1" }
remedy-ui-render-cpu = { path = "../remedy-ui-render-cpu", version = "1.0.0-rc.1" }
remedy-ui-core = { path = "../remedy-ui-core", version = "1.0.0-rc.1" }
remedy-ui-text = { path = "../remedy-ui-text", version = "1.0.0-rc.1" }

[lints]
workspace = true
