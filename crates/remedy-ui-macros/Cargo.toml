[package]
name = "remedy-ui-macros"
description = "RemedyUI macros: #[derive(Store)] for field-level reactive stores, #[preview] and #[previews] for previews in the gallery and golden tests."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
proc-macro = true

[dependencies]
proc-macro-crate = { version = "=3.5.0", default-features = false }
proc-macro2 = { version = "=1.0.107", default-features = false, features = ["proc-macro"] }
quote = { version = "=1.0.47", default-features = false, features = ["proc-macro"] }
syn = { version = "=2.0.119", default-features = false, features = ["clone-impls", "derive", "full", "parsing", "printing", "proc-macro"] }

[dev-dependencies]
remedy-ui-core = { path = "../remedy-ui-core", version = "1.0.0-rc.2" }

[lints]
workspace = true
