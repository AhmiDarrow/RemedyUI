[package]
name = "remedy-ui-macros"
description = "RemedyUI derive macros: #[derive(Store)] for field-level reactive stores."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
proc-macro = true

[dependencies]
proc-macro2 = { version = "=1.0.107", default-features = false, features = ["proc-macro"] }
quote = { version = "=1.0.47", default-features = false, features = ["proc-macro"] }
syn = { version = "=2.0.119", default-features = false, features = ["derive", "parsing", "printing", "proc-macro"] }

[dev-dependencies]
remedy-ui-reactive = { path = "../remedy-ui-reactive", version = "0.1.0" }

[lints]
workspace = true
