[package]
name = "remedy-ui-widgets-board"
description = "RemedyUI boards: spaces people arrange from built-in widgets and sandboxed scripted ones (in whichever script languages the board accepts), saved as versioned documents."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
remedy-ui-a11y = { path = "../remedy-ui-a11y", version = "0.1.0" }
remedy-ui-core = { path = "../remedy-ui-core", version = "0.1.0" }
remedy-ui-host = { path = "../remedy-ui-host", version = "0.1.0" }
remedy-ui-input = { path = "../remedy-ui-input", version = "0.1.0" }
remedy-ui-layout = { path = "../remedy-ui-layout", version = "0.1.0" }
remedy-ui-reactive = { path = "../remedy-ui-reactive", version = "0.1.0" }
remedy-ui-script = { path = "../remedy-ui-script", version = "0.1.0" }
remedy-ui-style = { path = "../remedy-ui-style", version = "0.1.0" }
remedy-ui-view = { path = "../remedy-ui-view", version = "0.1.0" }
remedy-ui-widgets-core = { path = "../remedy-ui-widgets-core", version = "0.1.0" }
remedy-ui-widgets-data = { path = "../remedy-ui-widgets-data", version = "0.1.0" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154" }

[dev-dependencies]
remedy-ui-devtools = { path = "../remedy-ui-devtools", version = "0.1.0" }
remedy-ui-fonts = { path = "../remedy-ui-fonts", version = "0.1.0", features = ["remedy-sans-ui"] }
remedy-ui-script-rhai = { path = "../remedy-ui-script-rhai", version = "0.1.0" }
remedy-ui-script-wasm = { path = "../remedy-ui-script-wasm", version = "0.1.0" }
remedy-ui-text = { path = "../remedy-ui-text", version = "0.1.0" }
remedy-ui-themes = { path = "../remedy-ui-themes", version = "0.1.0" }
wat = { version = "=1.263.0" }

# The browser test (tests/web.rs): both script engines and a board in a page.
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dev-dependencies]
wasm-bindgen-test = { version = "=0.3.80" }

[lints]
workspace = true
