[package]
name = "remedy-ui-widgets-board"
description = "RemedyUI boards: spaces people arrange from built-in widgets and sandboxed scripted ones (in whichever script languages the board accepts), saved as versioned documents."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
remedy-ui-core = { path = "../remedy-ui-core", version = "1.0.0-rc.1" }
remedy-ui-engine = { path = "../remedy-ui-engine", version = "1.0.0-rc.1", features = ["script", "view"] }
remedy-ui-platform = { path = "../remedy-ui-platform", version = "1.0.0-rc.1", features = ["services-i18n"] }
remedy-ui-widgets-core = { path = "../remedy-ui-widgets-core", version = "1.0.0-rc.1" }
remedy-ui-widgets-data = { path = "../remedy-ui-widgets-data", version = "1.0.0-rc.1" }
remedy-ui-widgets-forms = { path = "../remedy-ui-widgets-forms", version = "1.0.0-rc.1" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154" }

[dev-dependencies]
remedy-ui-devtools = { path = "../remedy-ui-devtools", version = "1.0.0-rc.1" }
remedy-ui-fonts = { path = "../remedy-ui-fonts", version = "1.0.0-rc.1", features = ["remedy-sans-ui"] }
remedy-ui-engine = { path = "../remedy-ui-engine", version = "1.0.0-rc.1", features = ["script-lua", "script-wasm"] }
remedy-ui-text = { path = "../remedy-ui-text", version = "1.0.0-rc.1" }
remedy-ui-themes = { path = "../remedy-ui-themes", version = "1.0.0-rc.1" }
wat = { version = "=1.263.0" }

# The browser test (tests/web.rs): both script engines and a board in a page.
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dev-dependencies]
wasm-bindgen-test = { version = "=0.3.80" }

[lints]
workspace = true
