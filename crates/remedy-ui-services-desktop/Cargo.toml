[package]
name = "remedy-ui-services-desktop"
description = "RemedyUI desktop services: starting with the session, URL schemes, jump lists and recent files, power (battery, sleep and resume, keeping awake), showing files in the file manager, and the user's usual folders."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", features = ["Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_Shell_PropertiesSystem", "Win32_Storage_EnhancedStorage", "Win32_Foundation"] }
windows-core = { version = "=0.62.2" }
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Power", "Win32_System_Threading", "Win32_System_Registry", "Win32_System_SystemServices", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "=0.6.5" }
objc2-foundation = { version = "=0.3.2" }
objc2-app-kit = { version = "=0.3.2" }

# Power on Linux: UPower and logind on the system bus, the screen saver on the session bus.
[target.'cfg(all(unix, not(any(target_os = "macos", target_os = "ios", target_os = "android"))))'.dependencies]
zbus = { version = "=6.3.0", default-features = false, features = ["default-rt", "proxy"] }
futures-core = { version = "=0.3.34" }

# The tests serve stand-ins for UPower, logind and the screen saver on a private bus.
[target.'cfg(all(unix, not(any(target_os = "macos", target_os = "ios", target_os = "android"))))'.dev-dependencies]
zbus = { version = "=6.3.0", default-features = false, features = ["default-rt", "proxy", "service"] }

[lints]
workspace = true
