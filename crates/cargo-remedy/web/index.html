<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- viewport-fit=cover: the app learns the screen's cutouts as its safe area. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="@THEME@">
<meta name="description" content="@DESCRIPTION@">
<title>@NAME@</title>
<link rel="manifest" href="manifest.webmanifest">
@ICON_LINKS@
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: @THEME@; }
  #remedy { position: fixed; inset: 0; }
  noscript { display: block; padding: 2em; font: 16px system-ui, sans-serif; color: #fff; }
</style>
</head>
<body>
<!-- The app's first window mounts here (remedy_ui::web::Mount::Auto). -->
<div id="remedy"></div>
<noscript>@NAME@ needs JavaScript and WebAssembly.</noscript>
<script type="module">
  import init from './app.js';
  init().catch((e) => {
    document.body.textContent = @NAME_JS@ + ' could not start: ' + e;
  });
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  }
</script>
</body>
</html>
