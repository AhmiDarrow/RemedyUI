[package]
name = "cargo-remedy"
description = "The RemedyUI command: `cargo remedy new` creates an app from a template, `cargo remedy run` runs it with devtools (and rebuilds on change with --watch), `cargo remedy package` builds installers and packages for Windows, Linux, macOS and Android, `cargo remedy migrate` follows renamed APIs; and the developer tools remedy-mcp offers agents (docs, widgets, rui, preview, audit, test, budgets, app, devtools)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme.workspace = true
keywords = ["cargo", "gui", "remedy", "package", "migrate"]
categories = ["development-tools::cargo-plugins", "gui"]

[[bin]]
name = "cargo-remedy"
path = "src/main.rs"

[dependencies]
flate2 = { version = "=1.1.11", default-features = false, features = ["rust_backend"] }
minisign = "=0.10.0"
png = "=0.18.1"
proc-macro2 = { version = "=1.0.107", default-features = false, features = ["span-locations"] }
remedy-templates = { path = "../remedy-templates", version = "0.1.0" }
remedy-tools = { path = "../remedy-tools", version = "0.1.0" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
syn = { version = "=2.0.119", default-features = false, features = ["full", "parsing", "printing", "visit"] }
toml = "=1.2.1"
zip = { version = "=9.6.1", default-features = false, features = ["deflate"] }

[dev-dependencies]
# The tool commands' tests run an app on the in-memory host that opens its window to agents
# and devtools.
remedy-ui = { path = "../remedy-ui", version = "0.1.0", default-features = false, features = ["widgets", "nav", "agents", "devtools", "headless"] }

[lints]
workspace = true
