# Rhai was the placeholder handwritten engine. RemedyLua is what ships. One rename
# changes the last path segment only, so `use remedy_ui::script_rhai` becomes
# `script_lua`, while `remedy_ui::script_rhai::RhaiEngine` is a manual edit (see the
# changelog): the type is `LuaEngine` on `remedy_ui::script_lua`.

[[rename]]
since = "1.0.0-rc.1"
kind = "path"
old = "remedy_ui::script_rhai"
new = "script_lua"

[[rename]]
since = "1.0.0-rc.1"
kind = "path"
old = "remedy_ui::script::Language::RHAI"
new = "LUA"

[[rename]]
since = "1.0.0-rc.1"
kind = "path"
old = "remedy_ui::script::Package::rhai"
new = "lua"
