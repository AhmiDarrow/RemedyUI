[package]
name = "remedy-ui-media-playback"
description = "RemedyUI media playback: sound and video from files and streams through the platform's own decoders (Media Foundation, GStreamer, AVFoundation, MediaCodec), kept in sync by the sound device's clock, with a keyboard-operable player widget and WebVTT, SRT and ASS captions."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
remedy-ui-a11y = { path = "../remedy-ui-a11y", version = "1.0.0-rc.1" }
remedy-ui-core = { path = "../remedy-ui-core", version = "1.0.0-rc.1" }
remedy-ui-input = { path = "../remedy-ui-input", version = "1.0.0-rc.1" }
remedy-ui-layout = { path = "../remedy-ui-layout", version = "1.0.0-rc.1" }
remedy-ui-media-video = { path = "../remedy-ui-media-video", version = "1.0.0-rc.1" }
remedy-ui-paint = { path = "../remedy-ui-paint", version = "1.0.0-rc.1" }
remedy-ui-reactive = { path = "../remedy-ui-reactive", version = "1.0.0-rc.1" }
remedy-ui-style = { path = "../remedy-ui-style", version = "1.0.0-rc.1" }
remedy-ui-view = { path = "../remedy-ui-view", version = "1.0.0-rc.1" }
remedy-ui-widgets-core = { path = "../remedy-ui-widgets-core", version = "1.0.0-rc.1" }

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Media_Audio",
    "Win32_Media_MediaFoundation",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
] }

# GStreamer (Linux) and the NDK's media and audio libraries (Android) are the system's own,
# opened at run time: nothing is linked or bundled, and a machine without them gets a clear
# `Unsupported` rather than an app that will not start.
[target.'cfg(any(target_os = "android", all(unix, not(any(target_os = "macos", target_os = "ios")))))'.dependencies]
libloading = { version = "=0.8.9" }

# A browser page: its WebCodecs decoders and WebAudio, and the web bridge's file store for
# files the person picked or dropped.
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
remedy-ui-bridge-web = { path = "../remedy-ui-bridge-web", version = "1.0.0-rc.1" }
wasm-bindgen = { version = "=0.2.130" }
wasm-bindgen-futures = { version = "=0.4.80" }
js-sys = { version = "=0.3.107" }
web-sys = { version = "=0.3.107", features = [
    "AudioBuffer",
    "AudioBufferSourceNode",
    "AudioContext",
    "AudioContextOptions",
    "AudioDestinationNode",
    "AudioNode",
    "AudioScheduledSourceNode",
    "BaseAudioContext",
    "Blob",
    "Response",
    "Url",
    "Window",
] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "=0.6.5" }
objc2-av-foundation = { version = "=0.3.2", default-features = false, features = ["std", "AVAsset", "AVAssetReader", "AVAssetReaderOutput", "AVAssetTrack", "AVMediaFormat", "objc2-core-media"] }
objc2-core-foundation = { version = "=0.3.2", default-features = false, features = ["std", "CFString"] }
objc2-core-media = { version = "=0.3.2", default-features = false, features = ["std", "CMBase", "CMBlockBuffer", "CMFormatDescription", "CMSampleBuffer", "CMTime", "CMTimeRange", "objc2-core-video"] }
objc2-core-video = { version = "=0.3.2", default-features = false, features = ["std", "CVBase", "CVBuffer", "CVImageBuffer", "CVPixelBuffer", "CVReturn"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSArray", "NSDictionary", "NSError", "NSString", "NSURL", "NSValue"] }

[target.'cfg(windows)'.dev-dependencies]
# tests/gpu_frames.rs: pictures on the GPU drawn by the GPU renderer.
remedy-ui-render-gpu = { path = "../remedy-ui-render-gpu", version = "1.0.0-rc.1" }

[dev-dependencies]
remedy-ui-compositor = { path = "../remedy-ui-compositor", version = "1.0.0-rc.1" }
remedy-ui-devtools = { path = "../remedy-ui-devtools", version = "1.0.0-rc.1" }
remedy-ui-fonts = { path = "../remedy-ui-fonts", version = "1.0.0-rc.1", features = ["remedy-sans-ui"] }
remedy-ui-render-cpu = { path = "../remedy-ui-render-cpu", version = "1.0.0-rc.1" }
remedy-ui-text = { path = "../remedy-ui-text", version = "1.0.0-rc.1" }
remedy-ui-themes = { path = "../remedy-ui-themes", version = "1.0.0-rc.1" }

# The browser tests (tests/web.rs, tests/web_gpu.rs): a player in a page through the facade's
# web bridge, drawn by the CPU renderer and by the GPU renderer.
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dev-dependencies]
wasm-bindgen-test = { version = "=0.3.80" }
web-sys = { version = "=0.3.107", features = ["console", "Document", "Element", "HtmlCanvasElement"] }
remedy-ui = { path = "../remedy-ui", default-features = false, features = ["widgets", "web", "playback", "gpu"] }

[lints]
workspace = true
