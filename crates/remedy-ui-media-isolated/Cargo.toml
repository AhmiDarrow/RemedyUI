[package]
name = "remedy-ui-media-isolated"
description = "RemedyUI isolated decoding: images decoded in a sandboxed helper process (AppContainer with a restricted token on Windows, seccomp-bpf and Landlock on Linux, the App Sandbox on macOS, an isolated service process on Android) that gets bytes and returns pixels over shared memory, so a decoder that crashes, hangs or is exploited takes down only the helper."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = ["anim"]
## Animations (GIF, APNG, animated WebP and added formats) decoded in the helper too.
anim = ["dep:remedy-ui-media-anim"]

# Only where a helper runs: elsewhere nothing is isolated, and images and animations decode in
# place.
[target.'cfg(any(windows, target_os = "linux", target_os = "macos", target_os = "android"))'.dependencies]
remedy-ui-media-anim = { path = "../remedy-ui-media-anim", version = "1.0.0-rc.1", default-features = false, optional = true }
remedy-ui-media-image = { path = "../remedy-ui-media-image", version = "1.0.0-rc.1", default-features = false }
remedy-ui-paint = { path = "../remedy-ui-paint", version = "1.0.0-rc.1" }
# Encodes the picture the helper is timed on at start-up (how fast this machine decodes).
image = { version = "=0.25.10", default-features = false, features = ["png"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Isolation", "Win32_Security_Authorization", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_System_Memory", "Win32_System_Pipes", "Win32_System_ProcessStatus", "Win32_System_Console", "Win32_System_SystemInformation"] }

[target.'cfg(unix)'.dependencies]
libc = { version = "=0.2.191" }

# The helper is an isolated service the bridge's Java declares, started through JNI with the
# app's Context from ndk-context (which android-activity fills in).
[target.'cfg(target_os = "android")'.dependencies]
jni = { version = "=0.21.1" }
ndk-context = { version = "=0.1.1" }

[dev-dependencies]
remedy-ui-media-anim = { path = "../remedy-ui-media-anim", version = "1.0.0-rc.1" }
gif = { version = "=0.14.2" }
remedy-ui-paint = { path = "../remedy-ui-paint", version = "1.0.0-rc.1" }
remedy-ui-media-image = { path = "../remedy-ui-media-image", version = "1.0.0-rc.1" }
remedy-ui-core = { path = "../remedy-ui-core", version = "1.0.0-rc.1" }
remedy-ui-fonts = { path = "../remedy-ui-fonts", version = "1.0.0-rc.1", features = ["remedy-sans-ui"] }
remedy-ui-text = { path = "../remedy-ui-text", version = "1.0.0-rc.1" }
remedy-ui-themes = { path = "../remedy-ui-themes", version = "1.0.0-rc.1" }
remedy-ui-view = { path = "../remedy-ui-view", version = "1.0.0-rc.1" }
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg"] }

[[test]]
name = "isolated"
# The test binary is also the helper: its own `main` enters helper mode first, as an app's does.
harness = false

# The same tests on Android, as a library an instrumentation runs inside an app
# (tools/android-check.sh): there a helper is an isolated service process, not a program.
[[example]]
name = "android-isolated-check"
crate-type = ["cdylib"]

[lints]
workspace = true
