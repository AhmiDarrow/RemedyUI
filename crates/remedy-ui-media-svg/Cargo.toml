[package]
name = "remedy-ui-media-svg"
description = "RemedyUI SVG: drawn by resvg at exactly the size shown, through the image loader (so SVG files work wherever images do), and tinted icons; untrusted files cannot read local files."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = ["svgz", "raster-images", "text"]
## Gzipped SVG (.svgz).
svgz = ["resvg/svgz"]
## Bitmaps embedded in SVG files (as data: URLs).
raster-images = ["resvg/raster-images"]
## Text in SVG files, drawn with the system's fonts (not on the web) and those added by `add_font`.
text = ["resvg/text", "resvg/system-fonts"]

[dependencies]
remedy-ui-a11y = { path = "../remedy-ui-a11y", version = "1.0.0-rc.1" }
remedy-ui-core = { path = "../remedy-ui-core", version = "1.0.0-rc.1" }
remedy-ui-media-image = { path = "../remedy-ui-media-image", version = "1.0.0-rc.1", default-features = false }
remedy-ui-paint = { path = "../remedy-ui-paint", version = "1.0.0-rc.1" }
remedy-ui-view = { path = "../remedy-ui-view", version = "1.0.0-rc.1" }
resvg = { version = "=0.50.0", default-features = false }

[dev-dependencies]
remedy-ui-fonts = { path = "../remedy-ui-fonts", version = "1.0.0-rc.1", features = ["remedy-sans-ui", "remedy-sans"] }
remedy-ui-reactive = { path = "../remedy-ui-reactive", version = "1.0.0-rc.1" }
remedy-ui-text = { path = "../remedy-ui-text", version = "1.0.0-rc.1" }
remedy-ui-themes = { path = "../remedy-ui-themes", version = "1.0.0-rc.1" }
image = { version = "=0.25.10", default-features = false, features = ["png"] }

[lints]
workspace = true
