[package]
name = "remedy-ui-script"
description = "RemedyUI scripted widgets: untrusted Luau in a sandbox with memory and time limits, describing elements the host builds."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
serde_json = { version = "=1.0.154" }

# Luau, built from source. A browser page cannot have it (see `src/unsupported.rs`).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
mlua = { version = "=0.11.6", features = ["luau", "vendored"] }

[lints]
workspace = true
