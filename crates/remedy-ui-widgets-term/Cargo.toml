[package]
name = "remedy-ui-widgets-term"
description = "RemedyUI terminals: VT and xterm emulation with scrollback, selection, links, input methods and true color. The PTY stays in the app."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
# Paul Williams' VT state machine, as Alacritty uses it: bytes to print, execute, CSI, OSC
# and DCS actions. The screen model on top is RemedyUI's own.
vte = { version = "=0.15.0", default-features = false, features = ["std"] }
# How many cells a character takes (UAX #11).
unicode-width = { version = "=0.2.3", default-features = false }
# OSC 52 clipboard payloads.
base64 = { version = "=0.23.1", default-features = false, features = ["alloc"] }
remedy-ui-core = { path = "../remedy-ui-core", version = "1.0.0-rc.1" }
remedy-ui-engine = { path = "../remedy-ui-engine", version = "1.0.0-rc.1", features = ["paint", "view"] }
remedy-ui-text = { path = "../remedy-ui-text", version = "1.0.0-rc.1" }

[dev-dependencies]
remedy-ui-engine = { path = "../remedy-ui-engine", version = "1.0.0-rc.1", features = ["compositor"] }
remedy-ui-devtools = { path = "../remedy-ui-devtools", version = "1.0.0-rc.1" }
remedy-ui-fonts = { path = "../remedy-ui-fonts", version = "1.0.0-rc.1", features = ["remedy-sans-ui", "ahmi-print"] }
remedy-ui-text = { path = "../remedy-ui-text", version = "1.0.0-rc.1", features = ["system-fonts"] }
remedy-ui-themes = { path = "../remedy-ui-themes", version = "1.0.0-rc.1" }

[lints]
workspace = true
