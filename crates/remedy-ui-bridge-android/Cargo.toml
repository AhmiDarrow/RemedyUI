[package]
name = "remedy-ui-bridge-android"
description = "RemedyUI Android bridge: the shared winit core on a native activity, plus the clipboard, links, capture protection, safe areas, back, the lifecycle, memory trims, system settings and screen readers."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

# What every platform builds: the platform-neutral parts (trim levels, settings, insets), so
# they are tested on any machine.
[dependencies]
remedy-ui-core = { path = "../remedy-ui-core", version = "1.0.0-rc.1" }
remedy-ui-host = { path = "../remedy-ui-host", version = "1.0.0-rc.1" }
remedy-ui-input = { path = "../remedy-ui-input", version = "1.0.0-rc.1" }

[target.'cfg(target_os = "android")'.dependencies]
remedy-ui-bridge-winit = { path = "../remedy-ui-bridge-winit", version = "1.0.0-rc.1" }
# A native activity: no Java of the app's own; the bridge's Java half comes in the APK (cargo remedy
# package) or is loaded from memory.
winit = { version = "=0.30.13", default-features = false, features = ["rwh_06", "android-native-activity"] }
# The same JNI release as the accessibility adapter, so both share one Java VM binding.
jni = { version = "=0.21.1" }
accesskit_android = { version = "=0.9.1", features = ["embedded-dex"] }
libc = { version = "=0.2.191" }

[dev-dependencies]
remedy-ui = { path = "../remedy-ui" }

# The demo is a shared library the activity loads (tools/build-apk.sh packages it).
[[example]]
name = "android-demo"
crate-type = ["cdylib"]

[lints]
workspace = true
