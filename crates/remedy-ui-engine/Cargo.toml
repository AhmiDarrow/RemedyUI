[package]
name = "remedy-ui-engine"
description = "RemedyUI's engine: display lists, the view tree and its elements, the compositor, the CPU and GPU renderers, effects and sandboxed scripts."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = []
compositor = ["dep:remedy-ui-core", "paint"]
effects = ["dep:remedy-ui-core", "paint"]
media-effects = ["dep:remedy-ui-core", "effects", "paint", "view"]
# Effect elements in windows the GPU renderer draws run on the GPU kernel (off: the CPU draws them).
media-effects-gpu = ["render-gpu"]
paint = ["dep:remedy-ui-core", "dep:remedy-ui-text"]
render-cpu = ["compositor", "dep:remedy-ui-core", "dep:remedy-ui-text", "dep:vello_cpu", "paint"]
render-gpu = ["compositor", "dep:ash", "dep:glow", "dep:js-sys", "dep:raw-window-handle", "dep:remedy-ui-core", "dep:vello_gpu", "dep:wasm-bindgen", "dep:wasm-bindgen-futures", "dep:web-sys", "dep:wgpu", "dep:windows", "effects", "paint", "render-cpu"]
render-gpu-windows-vulkan = ["dep:ash", "wgpu/vulkan"]
script = ["dep:remedy-ui-core", "dep:serde_json"]
script-lua = ["dep:remedy-lua", "dep:remedy-ui-core", "dep:serde_json", "script"]
script-wasm = ["dep:remedy-ui-core", "dep:serde_json", "dep:wasmi", "script"]
view = ["compositor", "dep:fluent-bundle", "dep:fluent-syntax", "dep:intl-memoizer", "dep:intl_pluralrules", "dep:remedy-ui-core", "dep:remedy-ui-text", "dep:stacker", "dep:unic-langid", "paint", "render-cpu"]

[dependencies]
fluent-bundle = { version = "=0.16.0", optional = true }
fluent-syntax = { version = "=0.12.0", optional = true }
intl-memoizer = { version = "=0.5.3", optional = true }
intl_pluralrules = { version = "=7.0.2", optional = true }
remedy-lua = { version = "=0.1.2", optional = true }
remedy-ui-core = { path = "../remedy-ui-core", version = "1.0.0-rc.1", optional = true }
remedy-ui-text = { path = "../remedy-ui-text", version = "1.0.0-rc.1", optional = true }
serde_json = { version = "=1.0.154", optional = true }
stacker = { version = "=0.1.25", optional = true }
unic-langid = { version = "=0.9.6", features = ["likelysubtags"], optional = true }
vello_cpu = { package = "remedy-vello-cpu", path = "../../vendor/vello_cpu", version = "=0.4.0", default-features = false, features = ["std", "u8_pipeline"], optional = true }
vello_gpu = { version = "=0.4.0", default-features = false, features = ["std", "wgpu", "all_shader_features"], optional = true }
wasmi = { version = "=2.0.2", default-features = false, features = ["std", "validate", "deterministic", "auto-dispatch"], optional = true }
wgpu = { version = "=30.0.2", default-features = false, features = ["std", "parking_lot", "wgsl"], optional = true }

[dev-dependencies]
log = { version = "=0.4.35" }
png = { version = "=0.18.1" }
remedy-ui-platform = { path = "../remedy-ui-platform", version = "1.0.0-rc.1", features = ["bridge-linux", "bridge-windows", "bridge-winit"] }
remedy-ui-core = { path = "../remedy-ui-core", version = "1.0.0-rc.1" }
remedy-ui-fonts = { path = "../remedy-ui-fonts", version = "1.0.0-rc.1", features = ["ahmi-print", "remedy-emoji", "remedy-sans", "remedy-sans-ui", "scripts"] }
remedy-ui-text = { path = "../remedy-ui-text", version = "1.0.0-rc.1" }
remedy-ui-widgets = { path = "../remedy-ui-widgets", version = "1.0.0-rc.1", features = ["themes"] }
wat = { version = "=1.263.0" }
wgpu = { version = "=30.0.2", features = ["counters"] }
remedy-ui-engine = { path = ".", features = ["compositor", "effects", "media-effects", "media-effects-gpu", "paint", "render-cpu", "render-gpu", "render-gpu-windows-vulkan", "script", "script-lua", "script-wasm", "view"] }

[target.'cfg(all(unix, not(any(target_os = "macos", target_os = "ios"))))'.dependencies]
ash = { version = "=0.38.0", optional = true }
wgpu = { version = "=30.0.2", default-features = false, features = ["vulkan", "gles"], optional = true }

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
wgpu = { version = "=30.0.2", default-features = false, features = ["metal"], optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
glow = { version = "=0.17.0", optional = true }
js-sys = { version = "=0.3.107", optional = true }
wasm-bindgen = { version = "=0.2.130", optional = true }
wasm-bindgen-futures = { version = "=0.4.80", optional = true }
web-sys = { version = "=0.3.107", features = ["Blob", "BlobPropertyBag", "MessageEvent", "Url", "WebGl2RenderingContext", "Window", "Worker"], optional = true }
wgpu = { version = "=30.0.2", default-features = false, features = ["webgpu", "webgl", "fragile-send-sync-non-atomic-wasm"], optional = true }

[target.'cfg(windows)'.dependencies]
ash = { version = "=0.38.0", optional = true }
raw-window-handle = { version = "=0.6.2", optional = true }
wgpu = { version = "=30.0.2", default-features = false, features = ["dx12"], optional = true }
windows = { version = "=0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Direct3D12", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_System_Diagnostics_Debug", "Win32_System_Kernel", "Win32_System_Threading"], optional = true }

