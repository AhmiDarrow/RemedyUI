# Claps, a RemedyUI widget written in Rust and compiled to WebAssembly. Not part of the
# workspace (it builds for wasm32 only); build it with:
#
#   cargo build --manifest-path crates/remedy-ui-engine/examples/script_wasm/claps/Cargo.toml \
#       --target wasm32-unknown-unknown --release --target-dir target/claps-widget
#   cp target/claps-widget/wasm32-unknown-unknown/release/remedy_claps_widget.wasm \
#       crates/remedy-ui-script-wasm/examples/claps.wasm
#
# (needs `rustup target add wasm32-unknown-unknown`). The engine's tests load the checked-in
# claps.wasm, and rebuild it to check it still matches when the target is installed.
[package]
name = "remedy-claps-widget"
description = "Claps: an example RemedyUI widget in Rust, compiled to WebAssembly."
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib"]

# No dependencies, so the build is the same on every machine with the same toolchain (a
# dependency's panic messages would carry the path it was built from). A real widget would
# use serde_json.
[dependencies]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
debug = false

# Its own workspace: not a member of RemedyUI's.
[workspace]
