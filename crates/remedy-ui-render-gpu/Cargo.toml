[package]
name = "remedy-ui-render-gpu"
description = "RemedyUI GPU renderer: wgpu (D3D12, Vulkan, Metal, GL, WebGPU, WebGL2) with vello_gpu tiles, a backend ladder, a persistent pipeline cache and device-loss recovery."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
remedy-ui-compositor = { path = "../remedy-ui-compositor", version = "1.0.0-rc.1" }
remedy-ui-core = { path = "../remedy-ui-core", version = "1.0.0-rc.1" }
remedy-ui-effects = { path = "../remedy-ui-effects", version = "1.0.0-rc.1" }
remedy-ui-host = { path = "../remedy-ui-host", version = "1.0.0-rc.1" }
remedy-ui-paint = { path = "../remedy-ui-paint", version = "1.0.0-rc.1" }
remedy-ui-render-cpu = { path = "../remedy-ui-render-cpu", version = "1.0.0-rc.1" }
remedy-ui-trace = { path = "../remedy-ui-trace", version = "1.0.0-rc.1" }
vello_gpu = { version = "=0.4.0", default-features = false, features = ["std", "wgpu", "all_shader_features"] }
# Only the backends each platform needs: every extra one costs binary size and start-up.
wgpu = { version = "=30.0.2", default-features = false, features = ["std", "parking_lot", "wgsl"] }

[target.'cfg(windows)'.dependencies]
# D3D12; the software rung is WARP, so no GL is needed.
wgpu = { version = "=30.0.2", default-features = false, features = ["dx12"] }

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
wgpu = { version = "=30.0.2", default-features = false, features = ["metal"] }

[target.'cfg(all(unix, not(any(target_os = "macos", target_os = "ios"))))'.dependencies]
# Vulkan first; GL for machines without a Vulkan driver.
wgpu = { version = "=30.0.2", default-features = false, features = ["vulkan", "gles"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# WebGPU first, WebGL2 where the browser has no WebGPU. A page without shared memory has one
# thread, so wgpu's handles are Send there by construction.
wgpu = { version = "=30.0.2", default-features = false, features = ["webgpu", "webgl", "fragile-send-sync-non-atomic-wasm"] }
# Browsers make adapters and devices through promises.
wasm-bindgen-futures = { version = "=0.4.80" }

[dev-dependencies]
# Resource counters prove no pipeline or shader is created after start-up (tests only).
wgpu = { version = "=30.0.2", features = ["counters"] }
remedy-ui-bridge-windows = { path = "../remedy-ui-bridge-windows", version = "1.0.0-rc.1" }
remedy-ui-bridge-winit = { path = "../remedy-ui-bridge-winit", version = "1.0.0-rc.1" }
remedy-ui-host = { path = "../remedy-ui-host", version = "1.0.0-rc.1" }
remedy-ui-fonts = { path = "../remedy-ui-fonts", version = "1.0.0-rc.1", features = ["remedy-sans-ui", "remedy-sans", "ahmi-print"] }
remedy-ui-input = { path = "../remedy-ui-input", version = "1.0.0-rc.1" }
remedy-ui-text = { path = "../remedy-ui-text", version = "1.0.0-rc.1" }

[lints]
workspace = true
