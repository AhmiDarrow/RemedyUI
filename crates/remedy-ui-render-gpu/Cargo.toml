[package]
name = "remedy-ui-render-gpu"
description = "RemedyUI GPU renderer: wgpu (D3D12, Vulkan, Metal, GL) with vello_gpu tiles, a backend ladder, a persistent pipeline cache and device-loss recovery."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
remedy-ui-compositor = { path = "../remedy-ui-compositor", version = "0.1.0" }
remedy-ui-core = { path = "../remedy-ui-core", version = "0.1.0" }
remedy-ui-host = { path = "../remedy-ui-host", version = "0.1.0" }
remedy-ui-paint = { path = "../remedy-ui-paint", version = "0.1.0" }
remedy-ui-render-cpu = { path = "../remedy-ui-render-cpu", version = "0.1.0" }
vello_gpu = { version = "=0.4.0" }
wgpu = { version = "=30.0.2" }

[dev-dependencies]
# Resource counters prove no pipeline or shader is created after start-up (tests only).
wgpu = { version = "=30.0.2", features = ["counters"] }
remedy-ui-bridge-windows = { path = "../remedy-ui-bridge-windows", version = "0.1.0" }
remedy-ui-bridge-winit = { path = "../remedy-ui-bridge-winit", version = "0.1.0" }
remedy-ui-host = { path = "../remedy-ui-host", version = "0.1.0" }
remedy-ui-fonts = { path = "../remedy-ui-fonts", version = "0.1.0", features = ["remedy-sans-ui"] }
remedy-ui-input = { path = "../remedy-ui-input", version = "0.1.0" }
remedy-ui-text = { path = "../remedy-ui-text", version = "0.1.0" }

[lints]
workspace = true
