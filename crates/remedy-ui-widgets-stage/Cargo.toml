[package]
name = "remedy-ui-widgets-stage"
description = "RemedyUI stage widgets for whole alternative presentations: scenes that scale art to fit with named anchors, pixel-art sprites, orbits, path layouts, knobs and tuner dials, faders, timelines, big physical buttons and display boards. Themed, accessible and idle when still."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
remedy-ui-core = { path = "../remedy-ui-core", version = "1.0.0-rc.1" }
remedy-ui-engine = { path = "../remedy-ui-engine", version = "1.0.0-rc.1", features = ["paint", "view"] }
remedy-ui-text = { path = "../remedy-ui-text", version = "1.0.0-rc.1" }
remedy-ui-viz = { path = "../remedy-ui-viz", version = "1.0.0-rc.1" }

[dev-dependencies]
remedy-ui-engine = { path = "../remedy-ui-engine", version = "1.0.0-rc.1", features = ["compositor", "render-cpu"] }
remedy-ui-devtools = { path = "../remedy-ui-devtools", version = "1.0.0-rc.1" }
remedy-ui-fonts = { path = "../remedy-ui-fonts", version = "1.0.0-rc.1", features = ["remedy-sans-ui"] }
remedy-ui-themes = { path = "../remedy-ui-themes", version = "1.0.0-rc.1" }

[lints]
workspace = true
