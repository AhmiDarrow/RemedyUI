[package]
name = "remedy-ui-media-anim"
description = "RemedyUI animated images: GIF, APNG and animated WebP decoded off the UI thread at the size they are shown, streamed in a window of frames, shared while in use, paused when unseen, and still under reduced motion."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = ["gif", "apng", "webp"]
gif = ["dep:gif"]
apng = ["dep:png"]
webp = ["dep:image-webp"]

[dependencies]
remedy-ui-a11y = { path = "../remedy-ui-a11y", version = "1.0.0-rc.1" }
remedy-ui-core = { path = "../remedy-ui-core", version = "1.0.0-rc.1" }
remedy-ui-layout = { path = "../remedy-ui-layout", version = "1.0.0-rc.1" }
remedy-ui-media-image = { path = "../remedy-ui-media-image", version = "1.0.0-rc.1" }
remedy-ui-paint = { path = "../remedy-ui-paint", version = "1.0.0-rc.1" }
remedy-ui-reactive = { path = "../remedy-ui-reactive", version = "1.0.0-rc.1" }
remedy-ui-style = { path = "../remedy-ui-style", version = "1.0.0-rc.1" }
remedy-ui-view = { path = "../remedy-ui-view", version = "1.0.0-rc.1" }
gif = { version = "=0.14.2", default-features = false, features = ["std"], optional = true }
png = { version = "=0.18.1", optional = true }
image-webp = { version = "=0.2.4", optional = true }

[dev-dependencies]
remedy-ui-compositor = { path = "../remedy-ui-compositor", version = "1.0.0-rc.1" }
remedy-ui-devtools = { path = "../remedy-ui-devtools", version = "1.0.0-rc.1" }
remedy-ui-fonts = { path = "../remedy-ui-fonts", version = "1.0.0-rc.1", features = ["remedy-sans-ui"] }
remedy-ui-input = { path = "../remedy-ui-input", version = "1.0.0-rc.1" }
remedy-ui-text = { path = "../remedy-ui-text", version = "1.0.0-rc.1" }
remedy-ui-themes = { path = "../remedy-ui-themes", version = "1.0.0-rc.1" }
gif = { version = "=0.14.2" }
png = { version = "=0.18.1" }
image-webp = { version = "=0.2.4" }

[lints]
workspace = true
