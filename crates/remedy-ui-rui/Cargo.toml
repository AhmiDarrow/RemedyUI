[package]
name = "remedy-ui-rui"
description = "RemedyUI markup (.rui): screens as data, compiled to Rust at build time or loaded at run time for live editing and people's own layouts."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = ["runtime"]
# Building files at run time and people's own layouts. Build scripts that only compile
# files use the crate without it.
runtime = [
    "remedy-ui-core/default",
    "remedy-ui-core/default",
    "remedy-ui-core/default",
    "remedy-ui-engine/view",
    "dep:remedy-ui-widgets-core",
]

[dependencies]
remedy-ui-core = { path = "../remedy-ui-core", version = "1.0.0-rc.1" }
remedy-ui-engine = { path = "../remedy-ui-engine", version = "1.0.0-rc.1", features = ["view"], optional = true }
remedy-ui-widgets-core = { path = "../remedy-ui-widgets-core", version = "1.0.0-rc.1", optional = true }

[dev-dependencies]
remedy-ui-core = { path = "../remedy-ui-core", version = "1.0.0-rc.1" }
remedy-ui-fonts = { path = "../remedy-ui-fonts", version = "1.0.0-rc.1", features = ["remedy-sans-ui"] }
remedy-ui-text = { path = "../remedy-ui-text", version = "1.0.0-rc.1" }
remedy-ui-themes = { path = "../remedy-ui-themes", version = "1.0.0-rc.1" }

[lints]
workspace = true
