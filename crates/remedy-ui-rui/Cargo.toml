[package]
name = "remedy-ui-rui"
description = "RemedyUI markup (.rui): screens as data, compiled to Rust at build time or loaded at run time for live editing and people's own layouts."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
default = ["runtime"]
# Building files at run time and people's own layouts. Build scripts that only compile
# files use the crate without it.
runtime = [
    "dep:remedy-ui-core",
    "dep:remedy-ui-layout",
    "dep:remedy-ui-reactive",
    "dep:remedy-ui-view",
    "dep:remedy-ui-widgets-core",
]

[dependencies]
remedy-ui-core = { path = "../remedy-ui-core", version = "0.1.0", optional = true }
remedy-ui-layout = { path = "../remedy-ui-layout", version = "0.1.0", optional = true }
remedy-ui-reactive = { path = "../remedy-ui-reactive", version = "0.1.0", optional = true }
remedy-ui-view = { path = "../remedy-ui-view", version = "0.1.0", optional = true }
remedy-ui-widgets-core = { path = "../remedy-ui-widgets-core", version = "0.1.0", optional = true }

[dev-dependencies]
remedy-ui-a11y = { path = "../remedy-ui-a11y", version = "0.1.0" }
remedy-ui-fonts = { path = "../remedy-ui-fonts", version = "0.1.0", features = ["remedy-sans-ui"] }
remedy-ui-text = { path = "../remedy-ui-text", version = "0.1.0" }
remedy-ui-themes = { path = "../remedy-ui-themes", version = "0.1.0" }

[lints]
workspace = true
