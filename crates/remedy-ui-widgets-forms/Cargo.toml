[package]
name = "remedy-ui-widgets-forms"
description = "RemedyUI form widgets: exact decimal number input, color picker with contrast readout, key capture, date and time pickers, and forms with validation, dirty tracking and submit state."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
remedy-ui-core = { path = "../remedy-ui-core", version = "1.0.0-rc.1" }
remedy-ui-engine = { path = "../remedy-ui-engine", version = "1.0.0-rc.1", features = ["paint", "view"] }
remedy-ui-services-i18n = { path = "../remedy-ui-services-i18n", version = "1.0.0-rc.1" }
remedy-ui-text = { path = "../remedy-ui-text", version = "1.0.0-rc.1" }
remedy-ui-widgets-core = { path = "../remedy-ui-widgets-core", version = "1.0.0-rc.1" }

[dev-dependencies]
remedy-ui-fonts = { path = "../remedy-ui-fonts", version = "1.0.0-rc.1", features = ["remedy-sans-ui"] }
remedy-ui-core = { path = "../remedy-ui-core", version = "1.0.0-rc.1" }
remedy-ui-themes = { path = "../remedy-ui-themes", version = "1.0.0-rc.1" }

[lints]
workspace = true
