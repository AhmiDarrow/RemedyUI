[package]
name = "remedy-ui-text"
description = "RemedyUI text: font collections and fallback, shaping, bidi, line breaking, rich paragraphs, hit testing and carets."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
remedy-ui-core = { path = "../remedy-ui-core", version = "1.0.0-rc.1" }
parley = { version = "=0.13.0", default-features = false, features = ["std"] }
# Only to load fontconfig at run time (with `system-fonts`).
fontique = { version = "=0.13.0", default-features = false, optional = true }
# The same skrifa parley uses, for outlines and hinting.
skrifa = { version = "=0.49.0", default-features = false, features = ["std", "autohint_shaping"] }
# Grapheme and word boundaries for editing; the same ICU4X parley uses.
icu_segmenter = { version = "=2.3.0", default-features = false, features = ["compiled_data"] }
ropey = { version = "=1.6.1", default-features = false, features = ["simd"] }
zeroize = { version = "=1.9.1", default-features = false, features = ["std"] }
# WOFF and WOFF2 web fonts unwrapped to TrueType/OpenType (pure Rust: brotli-decompressor and
# flate2's Rust backend).
wuff = { version = "=0.2.10", default-features = false, features = ["brotli", "z"] }
# UTS #39 confusable skeletons for look-alike names.
unicode-security = { version = "=0.1.3", default-features = false }

[features]
# Let font fallback reach the fonts installed on the system (emoji, CJK) as a last resort.
# fontconfig is loaded at run time on Linux, so builds need no fontconfig development files.
system-fonts = ["parley/system", "dep:fontique", "fontique/fontconfig-dlopen"]
# Dictionary line breaking inside words for Thai, Lao, Khmer and Burmese (several MB of
# ICU data). Without it those scripts break at spaces and punctuation; every other script,
# Chinese and Japanese included, breaks correctly either way.
complex-scripts = ["parley/complex-scripts"]

[dev-dependencies]
remedy-ui-fonts = { path = "../remedy-ui-fonts", version = "1.0.0-rc.1", features = ["remedy-sans-ui", "ahmi-print", "remedy-symbols", "scripts"] }
remedy-ui-fonts-cjk = { path = "../remedy-ui-fonts-cjk", version = "1.0.0-rc.1" }

[lints]
workspace = true
