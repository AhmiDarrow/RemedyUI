[package]
name = "remedy-ui-text"
description = "RemedyUI text: font collections and fallback, shaping, bidi, line breaking, rich paragraphs, hit testing and carets."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
remedy-ui-core = { path = "../remedy-ui-core", version = "0.1.0" }
parley = { version = "=0.13.0", default-features = false, features = ["std", "complex-scripts"] }

[features]
# Let font fallback reach the fonts installed on the system (emoji, CJK) as a last resort.
system-fonts = ["parley/system"]

[dev-dependencies]
remedy-ui-fonts = { path = "../remedy-ui-fonts", version = "0.1.0", features = ["remedy-sans-ui", "ahmi-print"] }

[lints]
workspace = true
