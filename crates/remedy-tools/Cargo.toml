[package]
name = "remedy-tools"
description = "The logic behind RemedyUI's developer tools (the remedy-mcp server and cargo remedy's commands): searching the docs and widget catalog, checking and compiling .rui markup, creating apps, rendering previews with their accessibility audit, running tests and budget scenes, and operating running apps and their remote devtools under the person's consent. Each tool group is a feature; no MCP or command-line code."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme.workspace = true
keywords = ["gui", "remedy", "mcp", "devtools", "accessibility"]
categories = ["development-tools", "gui"]

[features]
default = ["full"]
## Every tool group.
full = ["docs", "markup", "scaffold", "preview", "testing", "live", "devtools"]
## Search and read the guides, design docs and rustdoc; the widget catalog.
docs = ["dep:flate2", "dep:serde", "dep:serde_json"]
## Check `.rui` markup and compile it to Rust.
markup = ["dep:remedy-ui-rui", "dep:serde"]
## Create apps from the app templates (`remedy-templates`, shared with `cargo remedy new`).
scaffold = ["dep:remedy-templates", "dep:serde", "dep:serde_json"]
## Render an app's previews headlessly (PNG and accessibility tree) and audit them.
preview = ["dep:toml", "dep:serde", "dep:serde_json"]
## Run an app's tests and the engine's budget scenes, summarized.
testing = ["dep:serde", "dep:serde_json"]
## Operate a running app through its agents listener (consent, tokens, undo).
live = ["dep:serde", "dep:serde_json"]
## Read a running app's remote devtools.
devtools = ["dep:serde", "dep:serde_json"]
## JSON schemas for every tool's input (for protocol adapters).
schema = ["dep:schemars"]

[dependencies]
flate2 = { version = "=1.1.11", default-features = false, features = ["rust_backend"], optional = true }
remedy-templates = { path = "../remedy-templates", version = "0.1.0", optional = true }
remedy-ui-rui = { path = "../remedy-ui-rui", version = "0.1.0", default-features = false, optional = true }
schemars = { version = "=1.2.3", optional = true }
serde = { version = "=1.0.229", features = ["derive"], optional = true }
serde_json = { version = "=1.0.154", optional = true }
toml = { version = "=1.2.1", optional = true }

[lints]
workspace = true
