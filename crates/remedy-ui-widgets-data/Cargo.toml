[package]
name = "remedy-ui-widgets-data"
description = "RemedyUI data widgets: tables (sorting off the UI thread for large sets, column resize and reorder, frozen columns, virtual rows, inline editing), tree views (lazy children, drag or cut and paste to move) and property grids, with selection."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
remedy-ui-core = { path = "../remedy-ui-core", version = "1.0.0-rc.1" }
remedy-ui-engine = { path = "../remedy-ui-engine", version = "1.0.0-rc.1", features = ["view"] }
remedy-ui-widgets-core = { path = "../remedy-ui-widgets-core", version = "1.0.0-rc.1" }

[dev-dependencies]
remedy-ui-devtools = { path = "../remedy-ui-devtools", version = "1.0.0-rc.1" }
remedy-ui-fonts = { path = "../remedy-ui-fonts", version = "1.0.0-rc.1", features = ["remedy-sans-ui"] }
remedy-ui-engine = { path = "../remedy-ui-engine", version = "1.0.0-rc.1", features = ["paint"] }
remedy-ui-text = { path = "../remedy-ui-text", version = "1.0.0-rc.1" }
remedy-ui-themes = { path = "../remedy-ui-themes", version = "1.0.0-rc.1" }

[lints]
workspace = true
