[package]
name = "remedy-ui-script-wasm"
description = "RemedyUI scripted widgets in WebAssembly: compiled widgets run by a pure-Rust interpreter with fuel, memory limits and no host access beyond a small API."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
remedy-ui-core = { path = "../remedy-ui-core", version = "1.0.0-rc.1" }
remedy-ui-script = { path = "../remedy-ui-script", version = "1.0.0-rc.1" }
remedy-ui-trace = { path = "../remedy-ui-trace", version = "1.0.0-rc.1" }
# A pure-Rust interpreter (no JIT, no C), so it runs in a browser page too; modules are
# validated before they run. `auto-dispatch` picks the tail-call interpreter loop only where
# the build guarantees tail calls, the portable loop elsewhere.
wasmi = { version = "=2.0.1", default-features = false, features = ["std", "validate", "deterministic", "auto-dispatch"] }
serde_json = { version = "=1.0.154" }

[dev-dependencies]
# Hostile test modules are written as text.
wat = { version = "=1.263.0" }

[lints]
workspace = true
