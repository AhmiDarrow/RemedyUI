[package]
name = "remedy-ui-services-update"
description = "RemedyUI app updates: check a GitHub release or a JSON feed, download, verify the minisign signature and SHA-256, and apply (run the installer or swap the executable), plus an update banner."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
minisign-verify = { version = "=0.3.0" }
sha2 = { version = "=0.11.1" }
semver = { version = "=1.0.28" }
serde_json = { version = "=1.0.154" }
base64 = { version = "=0.23.1" }

remedy-ui-reactive = { path = "../remedy-ui-reactive", version = "0.1.0" }
remedy-ui-view = { path = "../remedy-ui-view", version = "0.1.0" }
remedy-ui-widgets-core = { path = "../remedy-ui-widgets-core", version = "0.1.0" }

# HTTPS for the updater; a browser page has none (its service worker updates it).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ureq = { version = "=3.5.2", default-features = false, features = ["rustls-no-provider", "platform-verifier"] }
# The TLS crypto provider ureq uses (pure Rust ring; no C toolchain).
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_WinTrust", "Win32_Security_Cryptography"] }

[dev-dependencies]
remedy-ui-core = { path = "../remedy-ui-core", version = "0.1.0" }
minisign = { version = "=0.10.0" }
remedy-ui-fonts = { path = "../remedy-ui-fonts", version = "0.1.0", features = ["remedy-sans-ui"] }
remedy-ui-text = { path = "../remedy-ui-text", version = "0.1.0" }
remedy-ui-themes = { path = "../remedy-ui-themes", version = "0.1.0" }
remedy-ui-a11y = { path = "../remedy-ui-a11y", version = "0.1.0" }

[lints]
workspace = true
