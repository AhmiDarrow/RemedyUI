[package]
name = "remedy-ui-devtools"
description = "RemedyUI devtools: the element inspector with live theme editing, the signal graph and why each element updated, the performance overlay and Perfetto traces, the screen-reader view with problems flagged, remote devtools over an authenticated local connection, and previews used as golden-image tests."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
png = { version = "=0.18.1" }
remedy-ui-core = { path = "../remedy-ui-core", version = "1.0.0-rc.1" }
remedy-ui-engine = { path = "../remedy-ui-engine", version = "1.0.0-rc.1", features = ["compositor", "paint", "render-cpu", "view"] }
remedy-ui-macros = { path = "../remedy-ui-macros", version = "1.0.0-rc.1" }
# Previews render every language: the script fallback faces too.
remedy-ui-fonts = { path = "../remedy-ui-fonts", version = "1.0.0-rc.1", features = ["scripts"] }
remedy-ui-fonts-cjk = { path = "../remedy-ui-fonts-cjk", version = "1.0.0-rc.1" }
remedy-ui-text = { path = "../remedy-ui-text", version = "1.0.0-rc.1" }
remedy-ui-themes = { path = "../remedy-ui-themes", version = "1.0.0-rc.1" }
remedy-ui-widgets-core = { path = "../remedy-ui-widgets-core", version = "1.0.0-rc.1" }
remedy-ui-widgets-forms = { path = "../remedy-ui-widgets-forms", version = "1.0.0-rc.1" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154" }

[features]
## Previews fall back to the system's fonts for scripts the bundled fonts lack.
system-fonts = ["remedy-ui-text/system-fonts"]

[lints]
workspace = true
