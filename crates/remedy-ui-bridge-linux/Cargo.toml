[package]
name = "remedy-ui-bridge-linux"
description = "RemedyUI desktop Linux bridge (Wayland and X11, chosen at run time): the shared winit core plus the clipboard, XDG portal settings and drag and drop both ways."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

# The bridge is empty on other platforms, so everything it uses is platform-specific.
[target.'cfg(all(unix, not(any(target_os = "macos", target_os = "ios", target_os = "android"))))'.dependencies]
remedy-ui-bridge-winit = { path = "../remedy-ui-bridge-winit", version = "0.1.0" }
remedy-ui-core = { path = "../remedy-ui-core", version = "0.1.0" }
remedy-ui-host = { path = "../remedy-ui-host", version = "0.1.0" }
remedy-ui-input = { path = "../remedy-ui-input", version = "0.1.0" }
arboard = { version = "=3.7.0", default-features = false, features = ["wayland-data-control"] }
libc = { version = "=0.2.191" }
zbus = { version = "=6.3.0", default-features = false, features = ["default-rt", "proxy", "service"] }
futures-core = { version = "=0.3.34" }
serde = { version = "=1.0.229", features = ["derive"] }
x11rb = { version = "=0.13.2" }
wayland-client = { version = "=0.31.15" }
wayland-backend = { version = "=0.3.17", features = ["client_system"] }

[lints]
workspace = true

[target.'cfg(all(unix, not(any(target_os = "macos", target_os = "ios", target_os = "android"))))'.dev-dependencies]
x11rb = { version = "=0.13.2", features = ["xtest"] }
