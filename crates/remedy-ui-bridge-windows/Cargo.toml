[package]
name = "remedy-ui-bridge-windows"
description = "RemedyUI Windows bridge: the shared winit core plus Win32 for the clipboard, capture protection and system settings."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
remedy-ui-bridge-winit = { path = "../remedy-ui-bridge-winit", version = "0.1.0" }
remedy-ui-core = { path = "../remedy-ui-core", version = "0.1.0" }
remedy-ui-host = { path = "../remedy-ui-host", version = "0.1.0" }
remedy-ui-input = { path = "../remedy-ui-input", version = "0.1.0" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Ole", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Registry", "Win32_Globalization", "Win32_Graphics_Dwm", "Win32_UI_Accessibility"] }

[lints]
workspace = true
