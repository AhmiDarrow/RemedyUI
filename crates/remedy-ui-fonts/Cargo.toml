[package]
name = "remedy-ui-fonts"
description = "The Remedy font families for RemedyUI apps (Remedy Sans UI, Remedy Sans, AhmiPrint, AhmiPixel, Remedy Symbols), Twemoji Mozilla color emoji, and Noto fallback faces for Arabic, Devanagari and Bengali, one feature per family."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "(MIT OR Apache-2.0) AND OFL-1.1 AND CC-BY-4.0"
repository.workspace = true
authors.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
include = ["src/**", "fonts/**", "Cargo.toml", "README.md"]

[features]
default = ["remedy-sans-ui", "remedy-symbols", "twemoji"]
remedy-sans-ui = []
remedy-sans = []
ahmi-print = []
ahmi-pixel = []
# The fallback face for interface symbols (arrows, shapes, stars, checks, warning, menu, search).
remedy-symbols = []
# Color emoji fallback (Twemoji Mozilla COLRv0, CC-BY-4.0 artwork, Apache-2.0 font tooling).
twemoji = []
# Fallback faces for the scripts Remedy Sans UI does not write (Noto Sans, OFL).
noto-arabic = []
noto-devanagari = []
noto-bengali = []
scripts = ["noto-arabic", "noto-devanagari", "noto-bengali"]
# Builds the fallback faces into a browser page's module too, instead of fetching each from
# beside the page when text first needs it (for a page not packaged by `cargo remedy`).
embed = []

[dependencies]

[dev-dependencies]
read-fonts = { version = "=0.47.0", default-features = false, features = ["std"] }

[lints]
workspace = true
