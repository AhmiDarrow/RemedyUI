[package]
name = "remedy-ui-services-webstorage"
description = "RemedyUI web storage import: reads a web view's localStorage (Chromium's LevelDB store, as WebView2, Android System WebView and Chrome keep it; or the page's own in a browser) read-only and losslessly, so an app moving off a web view keeps its users' data."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
# Snappy, the block compression of LevelDB tables (pure Rust, BSD-3-Clause, no dependencies).
snap = { version = "=1.1.2" }

# The page's own localStorage, in a browser.
[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = { version = "=0.3.107" }
wasm-bindgen = { version = "=0.2.130" }
web-sys = { version = "=0.3.107", features = ["Window", "Storage", "Location"] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = { version = "=0.3.80" }

[lints]
workspace = true
