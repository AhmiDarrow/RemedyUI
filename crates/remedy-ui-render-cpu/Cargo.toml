[package]
name = "remedy-ui-render-cpu"
description = "RemedyUI CPU renderer: draws display lists to pixels with vello_cpu plus RemedyUI glyph compositing; the reference renderer for golden images."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
remedy-ui-compositor = { path = "../remedy-ui-compositor", version = "1.0.0-rc.1" }
remedy-ui-core = { path = "../remedy-ui-core", version = "1.0.0-rc.1" }
remedy-ui-paint = { path = "../remedy-ui-paint", version = "1.0.0-rc.1" }
remedy-ui-text = { path = "../remedy-ui-text", version = "1.0.0-rc.1" }
remedy-ui-trace = { path = "../remedy-ui-trace", version = "1.0.0-rc.1" }
# RemedyUI's own copy of vello_cpu 0.4.0 with its fixes (vendor/vello_cpu/PATCHED.md).
vello_cpu = { package = "remedy-vello-cpu", path = "../../vendor/vello_cpu", version = "=0.4.0", default-features = false, features = ["std", "u8_pipeline"] }

[dev-dependencies]
remedy-ui-input = { path = "../remedy-ui-input", version = "1.0.0-rc.1" }
remedy-ui-fonts = { path = "../remedy-ui-fonts", version = "1.0.0-rc.1", features = ["remedy-sans-ui", "remedy-sans", "ahmi-print"] }

[lints]
workspace = true
