[package]
name = "remedy-ui-services-spell"
description = "RemedyUI spell checking: the platform's checker (Windows, macOS) or Hunspell dictionaries, word finding that skips links, mentions, numbers and code, a personal dictionary, and misspelling marks and suggestions for text fields."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
# Word boundaries inside Chinese, Japanese, Thai, Lao, Khmer and Burmese text, using ICU's
# dictionaries (several MB of data). Without it those scripts break at spaces and punctuation.
complex-scripts = []

[dependencies]
# A pure-Rust reader for Hunspell .aff/.dic dictionaries (MPL-2.0, used unmodified).
spellbook = { version = "=0.4.2" }
# Reads dictionaries that are not UTF-8 (old Hunspell files use ISO-8859-x and KOI8).
encoding_rs = { version = "=0.8.35", default-features = false, features = ["alloc"] }
# Word boundaries: the same ICU4X the text and localization crates use.
icu_segmenter = { version = "=2.3.0", default-features = false, features = ["compiled_data"] }
icu_locale_core = { version = "=2.4.0", default-features = false }
# One Unicode form (NFC) for the personal dictionary's words.
icu_normalizer = { version = "=2.3.0", default-features = false, features = ["compiled_data"] }

remedy-ui-core = { path = "../remedy-ui-core", version = "0.1.0" }
remedy-ui-reactive = { path = "../remedy-ui-reactive", version = "0.1.0" }
remedy-ui-view = { path = "../remedy-ui-view", version = "0.1.0" }
remedy-ui-widgets-core = { path = "../remedy-ui-widgets-core", version = "0.1.0" }

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", features = ["Win32_Globalization", "Win32_System_Com", "Win32_Foundation"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "=0.6.5" }
objc2-app-kit = { version = "=0.3.2" }
objc2-foundation = { version = "=0.3.2" }

[dev-dependencies]
remedy-ui-compositor = { path = "../remedy-ui-compositor", version = "0.1.0" }
remedy-ui-fonts = { path = "../remedy-ui-fonts", version = "0.1.0", features = ["remedy-sans-ui"] }
remedy-ui-input = { path = "../remedy-ui-input", version = "0.1.0" }
remedy-ui-layout = { path = "../remedy-ui-layout", version = "0.1.0" }
remedy-ui-render-cpu = { path = "../remedy-ui-render-cpu", version = "0.1.0" }
remedy-ui-style = { path = "../remedy-ui-style", version = "0.1.0" }
remedy-ui-text = { path = "../remedy-ui-text", version = "0.1.0" }
remedy-ui-themes = { path = "../remedy-ui-themes", version = "0.1.0" }

[lints]
workspace = true
