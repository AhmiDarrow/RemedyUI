[package]
name = "remedy-ui-customize"
description = "The code-fluid layer of RemedyUI: themes, shortcuts, toolbars and menus, and text that the person using an app can change, kept as readable files with undo, resets and safe loading, and the editors for them."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
remedy-ui-a11y = { path = "../remedy-ui-a11y", version = "0.1.0" }
remedy-ui-core = { path = "../remedy-ui-core", version = "0.1.0" }
remedy-ui-doc-code = { path = "../remedy-ui-doc-code", version = "0.1.0" }
remedy-ui-host = { path = "../remedy-ui-host", version = "0.1.0" }
remedy-ui-input = { path = "../remedy-ui-input", version = "0.1.0" }
remedy-ui-layout = { path = "../remedy-ui-layout", version = "0.1.0" }
remedy-ui-media-image = { path = "../remedy-ui-media-image", version = "0.1.0" }
remedy-ui-reactive = { path = "../remedy-ui-reactive", version = "0.1.0" }
remedy-ui-rui = { path = "../remedy-ui-rui", version = "0.1.0" }
remedy-ui-services-i18n = { path = "../remedy-ui-services-i18n", version = "0.1.0" }
remedy-ui-style = { path = "../remedy-ui-style", version = "0.1.0" }
remedy-ui-text = { path = "../remedy-ui-text", version = "0.1.0" }
remedy-ui-themes = { path = "../remedy-ui-themes", version = "0.1.0" }
remedy-ui-view = { path = "../remedy-ui-view", version = "0.1.0" }
remedy-ui-widgets-core = { path = "../remedy-ui-widgets-core", version = "0.1.0" }
remedy-ui-widgets-forms = { path = "../remedy-ui-widgets-forms", version = "0.1.0" }
remedy-ui-widgets-nav = { path = "../remedy-ui-widgets-nav", version = "0.1.0" }
serde_json = { version = "=1.0.154" }

[dev-dependencies]
remedy-ui-fonts = { path = "../remedy-ui-fonts", version = "0.1.0", features = ["remedy-sans-ui"] }

[lints]
workspace = true
