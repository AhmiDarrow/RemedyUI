[package]
name = "remedy-ui-widgets"
description = "RemedyUI's widgets: the core set, navigation, forms, data, music, stage, board and extra widgets, live visuals, themes, customization, markup, document views, developer tools, automation, spell checking and the update banner."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = []
automation = ["base", "dep:remedy-ui-core", "dep:remedy-ui-engine", "dep:serde", "dep:serde_json", "nav", "remedy-ui-engine/view"]
base = ["dep:remedy-ui-core", "dep:remedy-ui-engine", "remedy-ui-engine/paint", "remedy-ui-engine/view"]
board = ["base", "data", "dep:remedy-ui-core", "dep:remedy-ui-engine", "dep:remedy-ui-platform", "dep:serde", "dep:serde_json", "forms", "remedy-ui-engine/script", "remedy-ui-engine/view", "remedy-ui-platform/services-i18n"]
customize = ["base", "dep:remedy-ui-core", "dep:remedy-ui-engine", "dep:remedy-ui-media", "dep:remedy-ui-platform", "dep:remedy-ui-text", "dep:serde_json", "doc-code", "forms", "nav", "remedy-ui-engine/view", "remedy-ui-media/media-image", "remedy-ui-platform/services-i18n", "rui", "themes"]
data = ["base", "dep:remedy-ui-core", "dep:remedy-ui-engine", "remedy-ui-engine/view"]
devtools = ["base", "dep:png", "dep:remedy-ui-core", "dep:remedy-ui-engine", "dep:remedy-ui-fonts", "dep:remedy-ui-fonts-cjk", "dep:remedy-ui-macros", "dep:remedy-ui-text", "dep:serde", "dep:serde_json", "forms", "remedy-ui-engine/compositor", "remedy-ui-engine/paint", "remedy-ui-engine/render-cpu", "remedy-ui-engine/view", "themes"]
devtools-system-fonts = ["remedy-ui-text/system-fonts"]
doc-code = ["base", "dep:remedy-ui-core", "dep:remedy-ui-engine", "dep:remedy-ui-text", "dep:syntect", "doc-code-syntaxes", "remedy-ui-engine/view"]
doc-code-syntaxes = ["syntect/default-syntaxes"]
doc-pages = ["base", "dep:remedy-ui-core", "dep:remedy-ui-engine", "dep:remedy-ui-text", "remedy-ui-engine/compositor", "remedy-ui-engine/paint", "remedy-ui-engine/view"]
doc-rich = ["base", "dep:pulldown-cmark", "dep:remedy-ui-core", "dep:remedy-ui-engine", "dep:remedy-ui-text", "remedy-ui-engine/view"]
extra = ["base", "dep:encoding_rs", "dep:remedy-ui-core", "dep:remedy-ui-engine", "remedy-ui-engine/paint", "remedy-ui-engine/view", "viz"]
forms = ["base", "dep:remedy-ui-core", "dep:remedy-ui-engine", "dep:remedy-ui-platform", "remedy-ui-engine/paint", "remedy-ui-engine/view", "remedy-ui-platform/services-i18n"]
music = ["base", "dep:remedy-ui-core", "dep:remedy-ui-engine", "remedy-ui-engine/paint", "remedy-ui-engine/view"]
nav = ["base", "dep:remedy-ui-core", "dep:remedy-ui-engine", "dep:serde_json", "remedy-ui-engine/view"]
rui = ["dep:remedy-ui-core", "rui-runtime"]
rui-runtime = ["base", "remedy-ui-core/default", "remedy-ui-engine/view"]
spell = ["base", "dep:encoding_rs", "dep:icu_locale_core", "dep:icu_normalizer", "dep:icu_segmenter", "dep:objc2", "dep:objc2-app-kit", "dep:objc2-foundation", "dep:remedy-ui-core", "dep:remedy-ui-engine", "dep:spellbook", "dep:windows", "remedy-ui-engine/view"]
spell-complex-scripts = []
stage = ["dep:remedy-ui-core", "dep:remedy-ui-engine", "dep:remedy-ui-text", "remedy-ui-engine/paint", "remedy-ui-engine/view", "viz"]
themes = ["dep:remedy-ui-core", "dep:serde_json"]
update = ["base", "dep:base64", "dep:minisign-verify", "dep:remedy-ui-core", "dep:remedy-ui-engine", "dep:remedy-ui-platform", "dep:rustls", "dep:semver", "dep:serde_json", "dep:sha2", "dep:ureq", "dep:windows-sys", "remedy-ui-engine/view", "remedy-ui-platform/services-net"]
viz = ["dep:remedy-ui-core", "dep:remedy-ui-engine", "remedy-ui-engine/paint", "remedy-ui-engine/view"]

[dependencies]
base64 = { version = "=0.23.1", optional = true }
encoding_rs = { version = "=0.8.35", default-features = false, features = ["alloc"], optional = true }
icu_locale_core = { version = "=2.4.0", default-features = false, optional = true }
icu_normalizer = { version = "=2.3.0", default-features = false, features = ["compiled_data"], optional = true }
icu_segmenter = { version = "=2.3.0", default-features = false, features = ["compiled_data"], optional = true }
minisign-verify = { version = "=0.3.0", optional = true }
png = { version = "=0.18.1", optional = true }
pulldown-cmark = { version = "=0.13.6", default-features = false, optional = true }
remedy-ui-core = { path = "../remedy-ui-core", version = "1.1.2", optional = true }
remedy-ui-engine = { path = "../remedy-ui-engine", version = "1.1.2", optional = true }
remedy-ui-fonts = { path = "../remedy-ui-fonts", version = "1.1.2", features = ["scripts"], optional = true }
remedy-ui-fonts-cjk = { path = "../remedy-ui-fonts-cjk", version = "1.1.2", optional = true }
remedy-ui-macros = { path = "../remedy-ui-macros", version = "1.1.2", optional = true }
remedy-ui-media = { path = "../remedy-ui-media", version = "1.1.2", optional = true }
remedy-ui-platform = { path = "../remedy-ui-platform", version = "1.1.2", optional = true }
remedy-ui-text = { path = "../remedy-ui-text", version = "1.1.2", optional = true }
semver = { version = "=1.0.28", optional = true }
serde = { version = "=1.0.229", features = ["derive"], optional = true }
serde_json = { version = "=1.0.154", features = ["std"], optional = true }
sha2 = { version = "=0.11.1", optional = true }
spellbook = { version = "=0.4.2", optional = true }
syntect = { version = "=5.3.0", default-features = false, features = ["parsing", "regex-fancy", "yaml-load"], optional = true }

[dev-dependencies]
minisign = { version = "=0.10.0" }
remedy-ui-core = { path = "../remedy-ui-core", version = "1.1.2" }
remedy-ui-engine = { path = "../remedy-ui-engine", version = "1.1.2", features = ["compositor", "paint", "render-cpu", "render-gpu", "script-lua", "script-wasm"] }
remedy-ui-fonts = { path = "../remedy-ui-fonts", version = "1.1.2", features = ["remedy-sans-ui"] }
remedy-ui-text = { path = "../remedy-ui-text", version = "1.1.2" }
wat = { version = "=1.263.0" }
remedy-ui-widgets = { path = ".", features = ["automation", "base", "board", "customize", "data", "devtools", "devtools-system-fonts", "doc-code", "doc-code-syntaxes", "doc-pages", "doc-rich", "extra", "forms", "music", "nav", "rui", "rui-runtime", "spell", "spell-complex-scripts", "stage", "themes", "update", "viz"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
remedy-ui-platform = { path = "../remedy-ui-platform", version = "1.1.2", optional = true }
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"], optional = true }
ureq = { version = "=3.5.2", default-features = false, features = ["rustls-no-provider", "platform-verifier"], optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "=0.6.5", optional = true }
objc2-app-kit = { version = "=0.3.2", optional = true }
objc2-foundation = { version = "=0.3.2", optional = true }

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", features = ["Win32_Globalization", "Win32_System_Com", "Win32_Foundation"], optional = true }
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_WinTrust", "Win32_Security_Cryptography"], optional = true }

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dev-dependencies]
wasm-bindgen-test = { version = "=0.3.80" }

