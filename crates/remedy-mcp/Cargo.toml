[package]
name = "remedy-mcp"
description = "A Model Context Protocol server for RemedyUI: AI agents search the docs and widget catalog, check and compile .rui markup, create apps, render previews with their accessibility audit, run tests, and operate running apps and their devtools under the person's consent. Over stdio, or streamable HTTP on loopback with a token."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme.workspace = true
keywords = ["mcp", "gui", "remedy", "ai", "agents"]
categories = ["development-tools", "gui"]

[[bin]]
name = "remedy-mcp"
path = "src/main.rs"

[features]
default = ["full"]
## Every tool group, and streamable HTTP.
full = ["docs", "markup", "scaffold", "preview", "testing", "live", "devtools", "http"]
## docs_search, docs_read, widget_catalog; the guides as resources.
docs = ["remedy-tools/docs"]
## rui_check, rui_compile, rui_elements.
markup = ["remedy-tools/markup"]
## new_app.
scaffold = ["remedy-tools/scaffold"]
## render_preview, a11y_audit.
preview = ["remedy-tools/preview"]
## run_tests, budget_check.
testing = ["remedy-tools/testing"]
## app_connect, app_snapshot, app_act, app_command, app_undo, app_wait, app_disconnect.
live = ["remedy-tools/live"]
## devtools_connect, devtools_tree, devtools_element, devtools_semantics, devtools_signals,
## devtools_updates, devtools_timings, devtools_disconnect.
devtools = ["remedy-tools/devtools"]
## Streamable HTTP on loopback (`--http`), with a bearer token.
http = ["rmcp/transport-streamable-http-server", "dep:hyper", "dep:hyper-util", "dep:http-body-util", "dep:bytes", "dep:remedy-ui-core", "dep:tower-service"]

[dependencies]
bytes = { version = "=1.12.1", optional = true }
http-body-util = { version = "=0.1.5", optional = true }
hyper = { version = "=1.12.0", features = ["server", "http1"], optional = true }
hyper-util = { version = "=0.1.21", features = ["tokio"], optional = true }
remedy-tools = { path = "../remedy-tools", version = "0.1.0", default-features = false, features = ["schema"] }
remedy-ui-core = { path = "../remedy-ui-core", version = "0.1.0", optional = true }
rmcp = { version = "=3.11.0", default-features = false, features = ["server", "macros", "transport-io"] }
schemars = { version = "=1.2.3" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154" }
tower-service = { version = "=0.3.3", optional = true }
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "macros", "net", "io-std", "sync"] }

[dev-dependencies]
png = { version = "=0.18.1" }
# The tests run an app on the in-memory host that opens its window to agents and devtools.
remedy-ui = { path = "../remedy-ui", version = "0.1.0", default-features = false, features = ["widgets", "nav", "agents", "devtools", "headless"] }
rmcp = { version = "=3.11.0", default-features = false, features = ["client", "transport-child-process"] }

[lints]
workspace = true
