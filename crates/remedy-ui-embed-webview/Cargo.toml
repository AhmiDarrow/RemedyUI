[package]
name = "remedy-ui-embed-webview"
description = "RemedyUI web views: the platform's web view (WebView2, WebKitGTK) as an element that follows its box, with an allow-list for every navigation and one JSON message channel."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
remedy-ui-a11y = { path = "../remedy-ui-a11y", version = "1.0.0-rc.1" }
remedy-ui-core = { path = "../remedy-ui-core", version = "1.0.0-rc.1" }
remedy-ui-host = { path = "../remedy-ui-host", version = "1.0.0-rc.1" }
remedy-ui-reactive = { path = "../remedy-ui-reactive", version = "1.0.0-rc.1" }
remedy-ui-view = { path = "../remedy-ui-view", version = "1.0.0-rc.1" }
serde_json = { version = "=1.0.154" }

[target.'cfg(windows)'.dependencies]
# WebView2's COM interfaces and its statically linked loader.
webview2-com = { version = "=0.39.1" }
windows = { version = "=0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_Com", "Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging"] }
windows-core = { version = "=0.62.2" }

[target.'cfg(all(unix, not(any(target_os = "macos", target_os = "ios", target_os = "android"))))'.dependencies]
# dlopen of GTK 3, WebKitGTK and Xlib, so apps start (and build) without them.
libc = { version = "=0.2.191" }

[target.'cfg(windows)'.dev-dependencies]
remedy-ui = { path = "../remedy-ui", default-features = false, features = ["widgets"] }
remedy-ui-bridge-windows = { path = "../remedy-ui-bridge-windows", version = "1.0.0-rc.1" }
remedy-ui-bridge-winit = { path = "../remedy-ui-bridge-winit", version = "1.0.0-rc.1" }

[target.'cfg(all(unix, not(any(target_os = "macos", target_os = "ios", target_os = "android"))))'.dev-dependencies]
remedy-ui = { path = "../remedy-ui", default-features = false, features = ["widgets"] }
remedy-ui-bridge-linux = { path = "../remedy-ui-bridge-linux", version = "1.0.0-rc.1" }
remedy-ui-bridge-winit = { path = "../remedy-ui-bridge-winit", version = "1.0.0-rc.1" }

[lints]
workspace = true
