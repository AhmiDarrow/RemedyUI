[package]
name = "remedy-ui"
description = "RemedyUI for apps: open windows, run them on the platform's bridge with the GPU renderer (CPU fallback), persist window geometry, timers and the clipboard."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
default = ["gpu", "system-fonts"]
## Draw with the GPU renderer, falling back to the CPU renderer when no GPU works.
gpu = ["dep:remedy-ui-render-gpu"]
## Dictionary line breaking for Thai, Lao, Khmer and Burmese (adds several MB of data).
complex-scripts = ["remedy-ui-text/complex-scripts"]
## The inspector (F12 in any window, `Window::open_inspector`) and preview gallery.
devtools = ["dep:remedy-ui-devtools"]
## Font fallback reaches the system's fonts (Arabic, CJK, emoji and every script the
## bundled fonts lack).
system-fonts = ["remedy-ui-text/system-fonts", "remedy-ui-devtools?/system-fonts"]
## Every optional part of the engine.
full = ["gpu", "complex-scripts", "devtools", "system-fonts"]

[dependencies]
remedy-ui-compositor = { path = "../remedy-ui-compositor", version = "0.1.0" }
remedy-ui-core = { path = "../remedy-ui-core", version = "0.1.0" }
remedy-ui-fonts = { path = "../remedy-ui-fonts", version = "0.1.0" }
remedy-ui-host = { path = "../remedy-ui-host", version = "0.1.0" }
remedy-ui-input = { path = "../remedy-ui-input", version = "0.1.0" }
remedy-ui-layout = { path = "../remedy-ui-layout", version = "0.1.0" }
remedy-ui-reactive = { path = "../remedy-ui-reactive", version = "0.1.0" }
remedy-ui-render-cpu = { path = "../remedy-ui-render-cpu", version = "0.1.0" }
remedy-ui-render-gpu = { path = "../remedy-ui-render-gpu", version = "0.1.0", optional = true }
remedy-ui-devtools = { path = "../remedy-ui-devtools", version = "0.1.0", optional = true }
remedy-ui-secure = { path = "../remedy-ui-secure", version = "0.1.0" }
remedy-ui-style = { path = "../remedy-ui-style", version = "0.1.0" }
remedy-ui-text = { path = "../remedy-ui-text", version = "0.1.0" }
remedy-ui-tree = { path = "../remedy-ui-tree", version = "0.1.0" }
remedy-ui-view = { path = "../remedy-ui-view", version = "0.1.0" }

[target.'cfg(windows)'.dependencies]
remedy-ui-bridge-windows = { path = "../remedy-ui-bridge-windows", version = "0.1.0" }

[target.'cfg(target_os = "macos")'.dependencies]
remedy-ui-bridge-macos = { path = "../remedy-ui-bridge-macos", version = "0.1.0" }

[target.'cfg(all(unix, not(any(target_os = "macos", target_os = "ios", target_os = "android"))))'.dependencies]
remedy-ui-bridge-linux = { path = "../remedy-ui-bridge-linux", version = "0.1.0" }

[dev-dependencies]
remedy-ui-bridge-headless = { path = "../remedy-ui-bridge-headless", version = "0.1.0" }
remedy-ui-paint = { path = "../remedy-ui-paint", version = "0.1.0" }

[target.'cfg(windows)'.dev-dependencies]
remedy-ui-bridge-winit = { path = "../remedy-ui-bridge-winit", version = "0.1.0" }

[lints]
workspace = true
