[package]
name = "remedy-ui"
description = "RemedyUI for apps: open windows, run them on the platform's bridge with the GPU renderer (CPU fallback), persist window geometry, timers and the clipboard."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
default = ["gpu", "system-fonts", "widgets", "forms", "nav"]
## Draw with the GPU renderer, falling back to the CPU renderer when no GPU works.
gpu = ["dep:remedy-ui-render-gpu"]
## Dictionary line breaking for Thai, Lao, Khmer and Burmese (adds several MB of data).
complex-scripts = ["remedy-ui-text/complex-scripts"]
## The inspector (F12 in any window, `Window::open_inspector`) and preview gallery.
devtools = ["dep:remedy-ui-devtools"]
## Font fallback reaches the system's fonts (Arabic, CJK, emoji and every script the
## bundled fonts lack).
system-fonts = ["remedy-ui-text/system-fonts", "remedy-ui-devtools?/system-fonts"]
## The core widgets and the Remedy themes (`remedy_ui::widgets`, `remedy_ui::themes`); apps
## start styled with the first Remedy palette.
widgets = ["dep:remedy-ui-widgets-core", "dep:remedy-ui-themes"]
## Form widgets (`remedy_ui::forms`): exact numbers, colors, shortcuts, dates, times, forms.
forms = ["widgets", "i18n", "dep:remedy-ui-widgets-forms"]
## Navigation (`remedy_ui::nav`): commands and shortcuts, tabs, rails, stacks, toolbars,
## the command palette, drawers and a custom title bar.
nav = ["widgets", "dep:remedy-ui-widgets-nav"]
## Data (`remedy_ui::data`): tables, trees and property grids that stay fast at any size.
data = ["widgets", "dep:remedy-ui-widgets-data"]
## Live audio visuals (`remedy_ui::viz`): the speaking ring, level meters, sparklines and bars.
viz = ["widgets", "dep:remedy-ui-viz"]
## Images (`remedy_ui::image`): PNG, JPEG, GIF, WebP, BMP and ICO, decoded off the UI
## thread at the size shown, color-managed and shared while in use.
image = ["dep:remedy-ui-media-image"]
## SVG (`remedy_ui::svg`): SVG files wherever images go, and tinted icons.
svg = ["image", "dep:remedy-ui-media-svg"]
## Animated images (`remedy_ui::anim`): GIF, APNG and animated WebP, played while seen.
anim = ["image", "dep:remedy-ui-media-anim"]
## Video surfaces (`remedy_ui::video`): frames from any thread, converted on the GPU.
video = ["dep:remedy-ui-media-video"]
## Web views (`remedy_ui::webview`): the platform's web view (WebView2, WebKitGTK) as an
## element, with an allow-list for every navigation and one JSON message channel.
webview = ["dep:remedy-ui-embed-webview"]
## GPU embeds (`remedy_ui::gpu_embed`): the app's own wgpu rendering (a 3D preview, a game
## view) as an element, on the device RemedyUI's windows draw with.
gpu-embed = ["gpu", "dep:remedy-ui-embed-gpu"]
## Code (`remedy_ui::code`): code views with syntax colors from the theme, folding, diffs.
code = ["widgets", "dep:remedy-ui-doc-code"]
agents = ["widgets", "nav", "dep:remedy-ui-automation"]
markup = ["widgets", "dep:remedy-ui-rui"]
## Media playback (`remedy_ui::playback`): sound and video files and streams through the
## platform's decoders, kept in sync by the sound clock, with the `player` widget and
## captions. Wire its full-screen request to `Window::set_fullscreen`.
playback = ["widgets", "video", "dep:remedy-ui-media-playback"]
## Rich documents (`remedy_ui::rich`): Markdown, the rich text editor, the find bar.
rich = ["widgets", "dep:remedy-ui-doc-rich"]
## Paged documents (`remedy_ui::pages`): a page view with deep zoom from 1% to 6400%
## rendered off the UI thread, spreads, rotation, selection, search and thumbnails, over
## pages the app supplies (its PDF or e-book engine stays in the app).
pages = ["widgets", "dep:remedy-ui-doc-pages"]
## Spell checking (`remedy_ui::spell`): the platform's checker or Hunspell dictionaries.
spell = ["widgets", "dep:remedy-ui-services-spell"]
## Boards people arrange (`remedy_ui::board`), with sandboxed scripted widgets.
board = ["data", "dep:remedy-ui-widgets-board"]
## Localization (`remedy_ui::i18n`): Fluent messages, locale data, dates and exact numbers.
i18n = ["dep:remedy-ui-services-i18n"]
## Signed updates from GitHub releases or a feed (`remedy_ui::update`).
update = ["widgets", "dep:remedy-ui-services-update"]
## The in-memory host for tests (`remedy_ui::headless`).
headless = ["dep:remedy-ui-bridge-headless"]
## Every optional part of the engine.
full = ["gpu", "complex-scripts", "devtools", "system-fonts", "widgets", "forms", "nav", "data", "viz", "image", "svg", "anim", "video", "code", "rich", "pages", "spell", "board", "agents", "markup", "i18n", "update", "headless", "playback", "webview", "gpu-embed"]

[dependencies]
remedy-ui-compositor = { path = "../remedy-ui-compositor", version = "0.1.0" }
remedy-ui-core = { path = "../remedy-ui-core", version = "0.1.0" }
remedy-ui-fonts = { path = "../remedy-ui-fonts", version = "0.1.0" }
remedy-ui-host = { path = "../remedy-ui-host", version = "0.1.0" }
remedy-ui-input = { path = "../remedy-ui-input", version = "0.1.0" }
remedy-ui-layout = { path = "../remedy-ui-layout", version = "0.1.0" }
remedy-ui-reactive = { path = "../remedy-ui-reactive", version = "0.1.0" }
remedy-ui-render-cpu = { path = "../remedy-ui-render-cpu", version = "0.1.0" }
remedy-ui-render-gpu = { path = "../remedy-ui-render-gpu", version = "0.1.0", optional = true }
remedy-ui-devtools = { path = "../remedy-ui-devtools", version = "0.1.0", optional = true }
remedy-ui-widgets-core = { path = "../remedy-ui-widgets-core", version = "0.1.0", optional = true }
remedy-ui-widgets-forms = { path = "../remedy-ui-widgets-forms", version = "0.1.0", optional = true }
remedy-ui-widgets-nav = { path = "../remedy-ui-widgets-nav", version = "0.1.0", optional = true }
remedy-ui-widgets-data = { path = "../remedy-ui-widgets-data", version = "0.1.0", optional = true }
remedy-ui-viz = { path = "../remedy-ui-viz", version = "0.1.0", optional = true }
remedy-ui-media-image = { path = "../remedy-ui-media-image", version = "0.1.0", optional = true }
remedy-ui-media-svg = { path = "../remedy-ui-media-svg", version = "0.1.0", optional = true }
remedy-ui-doc-code = { path = "../remedy-ui-doc-code", version = "0.1.0", optional = true }
remedy-ui-automation = { path = "../remedy-ui-automation", version = "0.1.0", optional = true }
remedy-ui-rui = { path = "../remedy-ui-rui", version = "0.1.0", optional = true }
remedy-ui-media-video = { path = "../remedy-ui-media-video", version = "0.1.0", optional = true }
remedy-ui-embed-webview = { path = "../remedy-ui-embed-webview", version = "0.1.0", optional = true }
remedy-ui-embed-gpu = { path = "../remedy-ui-embed-gpu", version = "0.1.0", optional = true }
remedy-ui-media-anim = { path = "../remedy-ui-media-anim", version = "0.1.0", optional = true }
remedy-ui-media-playback = { path = "../remedy-ui-media-playback", version = "0.1.0", optional = true }
remedy-ui-doc-rich = { path = "../remedy-ui-doc-rich", version = "0.1.0", optional = true }
remedy-ui-doc-pages = { path = "../remedy-ui-doc-pages", version = "0.1.0", optional = true }
remedy-ui-services-spell = { path = "../remedy-ui-services-spell", version = "0.1.0", optional = true }
remedy-ui-widgets-board = { path = "../remedy-ui-widgets-board", version = "0.1.0", optional = true }
remedy-ui-themes = { path = "../remedy-ui-themes", version = "0.1.0", optional = true }
remedy-ui-services-update = { path = "../remedy-ui-services-update", version = "0.1.0", optional = true }
remedy-ui-services-i18n = { path = "../remedy-ui-services-i18n", version = "0.1.0", optional = true }
remedy-ui-bridge-headless = { path = "../remedy-ui-bridge-headless", version = "0.1.0", optional = true }
remedy-ui-secure = { path = "../remedy-ui-secure", version = "0.1.0" }
remedy-ui-style = { path = "../remedy-ui-style", version = "0.1.0" }
remedy-ui-text = { path = "../remedy-ui-text", version = "0.1.0" }
remedy-ui-tree = { path = "../remedy-ui-tree", version = "0.1.0" }
remedy-ui-view = { path = "../remedy-ui-view", version = "0.1.0" }

[target.'cfg(windows)'.dependencies]
remedy-ui-bridge-windows = { path = "../remedy-ui-bridge-windows", version = "0.1.0" }

[target.'cfg(target_os = "macos")'.dependencies]
remedy-ui-bridge-macos = { path = "../remedy-ui-bridge-macos", version = "0.1.0" }

[target.'cfg(all(unix, not(any(target_os = "macos", target_os = "ios", target_os = "android"))))'.dependencies]
remedy-ui-bridge-linux = { path = "../remedy-ui-bridge-linux", version = "0.1.0" }

[target.'cfg(target_os = "android")'.dependencies]
remedy-ui-bridge-android = { path = "../remedy-ui-bridge-android", version = "0.1.0" }

[dev-dependencies]
remedy-ui-bridge-headless = { path = "../remedy-ui-bridge-headless", version = "0.1.0" }
remedy-ui-paint = { path = "../remedy-ui-paint", version = "0.1.0" }

[target.'cfg(windows)'.dev-dependencies]
remedy-ui-bridge-winit = { path = "../remedy-ui-bridge-winit", version = "0.1.0" }

[lints]
workspace = true
