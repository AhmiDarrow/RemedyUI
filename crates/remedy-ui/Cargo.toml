[package]
name = "remedy-ui"
description = "RemedyUI for apps: open windows, run them on the platform's bridge with the GPU renderer (CPU fallback), persist window geometry, timers and the clipboard."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = ["gpu", "system-fonts", "script-fonts", "widgets", "forms", "nav", "language-names"]
## Draw with the GPU renderer, falling back to the CPU renderer when no GPU works.
gpu = ["remedy-ui-engine/render-gpu", "remedy-ui-engine/media-effects-gpu"]
## Dictionary line breaking for Thai, Lao, Khmer and Burmese (adds several MB of data).
complex-scripts = ["remedy-ui-text/complex-scripts"]
## The inspector (F12 in any window, `Window::open_inspector`) and preview gallery.
devtools = ["remedy-ui-widgets/devtools"]
## Font fallback reaches the system's fonts (Arabic, CJK, emoji and every script the
## bundled fonts lack).
system-fonts = ["remedy-ui-text/system-fonts", "remedy-ui-widgets?/devtools-system-fonts"]
## Bundled fallback faces for the scripts Remedy Sans UI does not write: Arabic, Devanagari,
## Bengali, Simplified Chinese and Japanese (Noto Sans, about 10 MB), so an interface in any
## of them never shows empty boxes, even where no such font is installed (the web, a
## minimal Linux, a CI machine). Without it, those scripts need the system's fonts. In a
## browser page they are not in the module: each is a file beside the page, fetched the
## first time text needs it (`cargo remedy package --target web` writes them).
script-fonts = ["remedy-ui-fonts/scripts", "cjk-fonts"]
## Just the Chinese and Japanese faces of `script-fonts` (Noto Sans SC and JP, 8.6 MB), for
## an app that turns `script-fonts` off and picks its scripts' faces itself
## (`remedy-ui-fonts/noto-arabic` and the like).
cjk-fonts = ["dep:remedy-ui-fonts-cjk"]
## Builds the fallback faces into a browser page's module, as on the desktop, instead of
## fetching them from beside the page: for a page not packaged by `cargo remedy`.
web-embed-fonts = ["remedy-ui-fonts/embed", "remedy-ui-fonts-cjk?/embed"]
## The core widgets and the Remedy themes (`remedy_ui::widgets`, `remedy_ui::themes`); apps
## start styled with the first Remedy palette.
widgets = ["remedy-ui-widgets/base", "remedy-ui-widgets/themes"]
## Form widgets (`remedy_ui::forms`): exact numbers, colors, shortcuts, dates, times, forms.
forms = ["widgets", "i18n", "remedy-ui-widgets/forms"]
## Navigation (`remedy_ui::nav`): commands and shortcuts, tabs, rails, stacks, toolbars,
## the command palette, drawers and a custom title bar.
nav = ["widgets", "remedy-ui-widgets/nav"]
## Data (`remedy_ui::data`): tables, trees and property grids that stay fast at any size.
data = ["widgets", "remedy-ui-widgets/data"]
## Live audio visuals (`remedy_ui::viz`): the speaking ring, level meters, sparklines and bars.
viz = ["widgets", "remedy-ui-widgets/viz"]
## Music widgets (`remedy_ui::music`): fretboard, chord diagram, tab staff and note staff.
music = ["widgets", "remedy-ui-widgets/music"]
## Extra widgets (`remedy_ui::extra`): QR code, rating, carousel, setup wizard flow and swatch grid.
extra = ["widgets", "viz", "remedy-ui-widgets/extra"]
## Stage widgets (`remedy_ui::stage`) for whole alternative presentations: scenes with art
## and anchors, pixel-art sprites, orbits, path layouts, knobs and tuners, faders, timelines,
## big physical buttons and display boards.
stage = ["widgets", "viz", "remedy-ui-widgets/stage"]
# Prism: .rfx effects (fire, water, glow, particles, 3D) as elements, on the GPU kernel or the CPU.
effects = ["remedy-ui-engine/effects", "remedy-ui-engine/media-effects"]
## Images (`remedy_ui::image`): PNG, JPEG, GIF, WebP, BMP and ICO, decoded off the UI
## thread at the size shown, color-managed and shared while in use.
image = ["remedy-ui-media/media-image"]
## SVG (`remedy_ui::svg`): SVG files wherever images go, and tinted icons.
svg = ["image", "remedy-ui-media/media-image-svg", "remedy-ui-media/media-image-svgz", "remedy-ui-media/media-image-svg-raster-images", "remedy-ui-media/media-image-svg-text"]
## Animated images (`remedy_ui::anim`): GIF, APNG and animated WebP, played while seen.
anim = ["image", "remedy-ui-media/media-anim"]
## Video surfaces (`remedy_ui::video`): frames from any thread, converted on the GPU.
video = ["remedy-ui-media/media-video"]
## Web views (`remedy_ui::webview`): the platform's web view (WebView2, WebKitGTK) as an
## element, with an allow-list for every navigation and one JSON message channel.
webview = ["remedy-ui-platform/embed-webview"]
## GPU embeds (`remedy_ui::gpu_embed`): the app's own wgpu rendering (a 3D preview, a game
## view) as an element, on the device RemedyUI's windows draw with.
gpu-embed = ["gpu", "remedy-ui-platform/embed-gpu"]
## Code (`remedy_ui::code`): code views with syntax colors from the theme, folding, diffs.
code = ["widgets", "remedy-ui-widgets/doc-code"]
agents = ["widgets", "nav", "remedy-ui-widgets/automation"]
markup = ["widgets", "remedy-ui-widgets/rui"]
## Media playback (`remedy_ui::playback`): sound and video files and streams through the
## platform's decoders, kept in sync by the sound clock, with the `player` widget and
## captions. Wire its full-screen request to `Window::set_fullscreen`.
playback = ["widgets", "video", "dep:remedy-ui-media-playback"]
## Terminals (`remedy_ui::term`): VT and xterm emulation with scrollback, selection, links,
## input methods and true color; the app keeps the PTY.
term = ["widgets", "dep:remedy-ui-widgets-term"]
## Rich documents (`remedy_ui::rich`): Markdown, the rich text editor, the find bar.
rich = ["widgets", "remedy-ui-widgets/doc-rich"]
## Paged documents (`remedy_ui::pages`): a page view with deep zoom from 1% to 6400%
## rendered off the UI thread, spreads, rotation, selection, search and thumbnails, over
## pages the app supplies (its PDF or e-book engine stays in the app).
pages = ["widgets", "remedy-ui-widgets/doc-pages"]
## Spell checking (`remedy_ui::spell`): the platform's checker or Hunspell dictionaries.
spell = ["widgets", "remedy-ui-widgets/spell"]
## Boards people arrange (`remedy_ui::board`), with sandboxed scripted widgets in the
## languages the board accepts (`remedy_ui::script` is the language-neutral interface).
board = ["data", "remedy-ui-widgets/board", "remedy-ui-engine/script"]
## Scripted widgets people write by hand in RemedyLua (`remedy_ui::script_lua`).
script-lua = ["board", "remedy-ui-engine/script-lua"]
## Scripted widgets compiled to WebAssembly, run by a pure-Rust interpreter
## (`remedy_ui::script_wasm`).
script-wasm = ["board", "remedy-ui-engine/script-wasm"]
## What people change about the app (`remedy_ui::customize`): their theme, shortcuts,
## toolbars and menus, and text, kept as readable files with undo and resets, and the editors
## for them; `App::customizations` keeps them in the app's data folder.
customize = ["forms", "nav", "i18n", "remedy-ui-widgets/customize"]
## Localization (`remedy_ui::i18n`): Fluent messages, locale data, dates and exact numbers.
i18n = ["remedy-ui-platform/services-i18n"]
## Every language CLDR names, in every locale CLDR has, for `i18n::language_name` (a subtitle
## or audio track's language: "Korean", "Koreanisch"; ISO 639-2 codes like `ger` too; about
## 3 MB of data). Without it, only the languages the engine ships are named.
language-names = ["i18n", "remedy-ui-platform/services-i18n-language-names"]
## Importing what a web version saved (`remedy_ui::webstorage`): a web view's localStorage
## (WebView2, Android System WebView, Chrome), read losslessly and read-only, or the page's
## own in a browser.
webstorage = ["remedy-ui-platform/services-webstorage"]
## `#[derive(Store)]` (`remedy_ui::Store`): field-level reactive stores.
macros = ["dep:remedy-ui-macros"]
## Images and animations decoded in a sandboxed helper process (`remedy_ui::isolated`), so a
## decoder that crashes, hangs or runs away with memory takes down only the helper.
isolated = ["image", "anim", "remedy-ui-media/media-isolated"]
## Desktop services (`remedy_ui::desktop`): starting with the session, URL schemes
## (`App::on_url`), jump lists and recent files, power (`App::on_power`, keeping awake),
## showing files in the file manager and the user's usual folders.
desktop = ["remedy-ui-platform/services-desktop"]
## The player in the system's media controls (`Player::now_playing`): Windows' SMTC, a
## browser's `navigator.mediaSession`.
media-session = ["playback", "desktop", "remedy-ui-media-playback/media-session"]
## The screen held on while video plays (`Player::set_keep_awake`), through the desktop
## services' power inhibit: Windows, macOS, Linux, Android, a browser's Screen Wake Lock.
keep-awake = ["playback", "desktop", "remedy-ui-media-playback/keep-awake"]
## The HTTP client (`remedy_ui::net`): JSON requests with typed decoding, HTTP errors with
## their detail, multipart uploads, keepalive requests, timeouts, and cancellation that follows a
## `Resource`'s key; natively (rustls) and in a browser page (`fetch`).
net = ["remedy-ui-platform/services-net"]
## Signed updates from GitHub releases or a feed (`remedy_ui::update`).
update = ["widgets", "remedy-ui-widgets/update"]
## The in-memory host for tests (`remedy_ui::headless`).
headless = ["remedy-ui-platform/bridge-headless"]
## Browser pages and PWAs (`remedy_ui::web`): `run` starts the app in the page on
## `wasm32-unknown-unknown`, where `AppConfig::web` says where it mounts. On other targets,
## only the module's types (`WebConfig`, `Mount`) and its documentation, with no web code.
web = ["dep:remedy-ui-bridge-web"]
## Every optional part of the engine.
full = ["gpu", "complex-scripts", "devtools", "system-fonts", "script-fonts", "widgets", "forms", "nav", "data", "viz", "image", "svg", "anim", "video", "code", "term", "rich", "pages", "spell", "board", "script-lua", "script-wasm", "agents", "markup", "i18n", "net", "update", "headless", "playback", "webview", "gpu-embed", "music", "extra", "stage", "effects", "customize", "web", "macros", "isolated", "webstorage", "desktop", "media-session", "keep-awake"]

[dependencies]
remedy-ui-core = { path = "../remedy-ui-core", version = "1.0.0-rc.1", features = ["reactive-persist"] }
remedy-ui-macros = { path = "../remedy-ui-macros", version = "1.0.0-rc.1", optional = true }
remedy-ui-media = { path = "../remedy-ui-media", version = "1.0.0-rc.1", features = ["media-anim", "media-image", "media-isolated", "media-video"], optional = true }
remedy-ui-engine = { path = "../remedy-ui-engine", version = "1.0.0-rc.1", features = ["compositor", "effects", "media-effects", "paint", "render-cpu", "render-gpu", "script", "script-lua", "script-wasm", "view"] }
remedy-ui-fonts = { path = "../remedy-ui-fonts", version = "1.0.0-rc.1" }
remedy-ui-fonts-cjk = { path = "../remedy-ui-fonts-cjk", version = "1.0.0-rc.1", optional = true }
remedy-ui-widgets = { path = "../remedy-ui-widgets", version = "1.0.0-rc.1", features = ["automation", "base", "board", "customize", "data", "devtools", "doc-code", "doc-pages", "doc-rich", "extra", "forms", "music", "nav", "rui", "spell", "stage", "themes", "update", "viz"], optional = true }
remedy-ui-widgets-term = { path = "../remedy-ui-widgets-term", version = "1.0.0-rc.1", optional = true }
remedy-ui-platform = { path = "../remedy-ui-platform", version = "1.0.0-rc.1", features = ["bridge-headless", "embed-gpu", "embed-webview", "services-desktop", "services-i18n", "services-net", "services-webstorage"] }
remedy-ui-media-playback = { path = "../remedy-ui-media-playback", version = "1.0.0-rc.1", optional = true }
# On every target for `remedy_ui::web`'s types (`WebConfig`, `Mount`, the file store) and its
# documentation; the browser bindings it starts apps with are its wasm32-only dependencies,
# so native builds pull in nothing of the web.
remedy-ui-bridge-web = { path = "../remedy-ui-bridge-web", version = "1.0.0-rc.1", optional = true }
zeroize = { version = "=1.9.1", default-features = false, features = ["std"] }
remedy-ui-text = { path = "../remedy-ui-text", version = "1.0.0-rc.1" }

[target.'cfg(windows)'.dependencies]
remedy-ui-platform = { path = "../remedy-ui-platform", version = "1.0.0-rc.1", features = ["bridge-windows"] }

[target.'cfg(target_os = "macos")'.dependencies]
remedy-ui-platform = { path = "../remedy-ui-platform", version = "1.0.0-rc.1", features = ["bridge-macos"] }

[target.'cfg(all(unix, not(any(target_os = "macos", target_os = "ios", target_os = "android"))))'.dependencies]
remedy-ui-platform = { path = "../remedy-ui-platform", version = "1.0.0-rc.1", features = ["bridge-linux"] }

[target.'cfg(target_os = "android")'.dependencies]
remedy-ui-platform = { path = "../remedy-ui-platform", version = "1.0.0-rc.1", features = ["bridge-android"] }


[dev-dependencies]
# The network guide's samples decode JSON into their own types.
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154" }
remedy-ui-platform = { path = "../remedy-ui-platform", version = "1.0.0-rc.1", features = ["bridge-headless"] }
remedy-ui-engine = { path = "../remedy-ui-engine", version = "1.0.0-rc.1", features = ["compositor", "render-cpu", "render-gpu"] }
png = { version = "=0.18.1" }

[target.'cfg(windows)'.dev-dependencies]
remedy-ui-platform = { path = "../remedy-ui-platform", version = "1.0.0-rc.1", features = ["bridge-winit"] }

# tests/real_cursor.rs on Linux: the pointer read with XFixes and moved with XTest.
[target.'cfg(target_os = "linux")'.dev-dependencies]
remedy-ui-platform = { path = "../remedy-ui-platform", version = "1.0.0-rc.1", features = ["bridge-winit"] }
x11rb = { version = "=0.13.2", features = ["xfixes", "xtest"] }

# Tests, examples and the guide's doctests build with every pack, so `cargo test` checks all of them.
[target.'cfg(not(any(target_os = "android", target_arch = "wasm32")))'.dev-dependencies]
remedy-ui = { path = ".", features = ["full"] }

# On Android and the web (linted, not tested there), the packs the tests and examples use; the
# packs that build C or C++ need toolchains those lints do not set up.
[target.'cfg(any(target_os = "android", target_arch = "wasm32"))'.dev-dependencies]
remedy-ui = { path = ".", features = ["customize", "markup", "macros", "agents", "headless", "data", "viz", "pages", "webstorage"] }

# tests/web_assets.rs, in a browser (`remedy-ui-bridge-web/tools/web-test.sh`): what a page
# fetches or reads rather than carries.
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dev-dependencies]
remedy-ui = { path = ".", features = ["web", "script-fonts", "language-names", "webstorage"] }
wasm-bindgen-test = { version = "=0.3.80" }
wasm-bindgen-futures = { version = "=0.4.80" }
js-sys = { version = "=0.3.107" }
web-sys = { version = "=0.3.107", features = ["Window", "Storage", "Performance", "console"] }

[lints]
workspace = true

# Prism effects are not in the smaller Android and web builds the examples are linted with.
[[example]]
name = "effects_gallery"
required-features = ["effects"]

[[example]]
name = "glass_and_shadows"
required-features = ["effects"]

[[test]]
name = "effects_markup"
required-features = ["effects", "markup"]
