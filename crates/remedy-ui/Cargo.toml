[package]
name = "remedy-ui"
description = "RemedyUI for apps: open windows, run them on the platform's bridge with the GPU renderer (CPU fallback), persist window geometry, timers and the clipboard."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = ["gpu", "system-fonts", "script-fonts", "widgets", "forms", "nav"]
## Draw with the GPU renderer, falling back to the CPU renderer when no GPU works.
gpu = ["dep:remedy-ui-render-gpu", "remedy-ui-media-effects?/gpu"]
## Dictionary line breaking for Thai, Lao, Khmer and Burmese (adds several MB of data).
complex-scripts = ["remedy-ui-text/complex-scripts"]
## The inspector (F12 in any window, `Window::open_inspector`) and preview gallery.
devtools = ["dep:remedy-ui-devtools"]
## Font fallback reaches the system's fonts (Arabic, CJK, emoji and every script the
## bundled fonts lack).
system-fonts = ["remedy-ui-text/system-fonts", "remedy-ui-devtools?/system-fonts"]
## Bundled fallback faces for the scripts Remedy Sans UI does not write: Arabic, Devanagari,
## Bengali, Simplified Chinese and Japanese (Noto Sans, about 10 MB), so an interface in any
## of them never shows empty boxes, even where no such font is installed (the web, a
## minimal Linux, a CI machine). Without it, those scripts need the system's fonts.
script-fonts = ["remedy-ui-fonts/scripts", "dep:remedy-ui-fonts-cjk"]
## The core widgets and the Remedy themes (`remedy_ui::widgets`, `remedy_ui::themes`); apps
## start styled with the first Remedy palette.
widgets = ["dep:remedy-ui-widgets-core", "dep:remedy-ui-themes"]
## Form widgets (`remedy_ui::forms`): exact numbers, colors, shortcuts, dates, times, forms.
forms = ["widgets", "i18n", "dep:remedy-ui-widgets-forms"]
## Navigation (`remedy_ui::nav`): commands and shortcuts, tabs, rails, stacks, toolbars,
## the command palette, drawers and a custom title bar.
nav = ["widgets", "dep:remedy-ui-widgets-nav"]
## Data (`remedy_ui::data`): tables, trees and property grids that stay fast at any size.
data = ["widgets", "dep:remedy-ui-widgets-data"]
## Live audio visuals (`remedy_ui::viz`): the speaking ring, level meters, sparklines and bars.
viz = ["widgets", "dep:remedy-ui-viz"]
## Music widgets (`remedy_ui::music`): fretboard, chord diagram, tab staff and note staff.
music = ["widgets", "dep:remedy-ui-widgets-music"]
## Extra widgets (`remedy_ui::extra`): QR code, rating, carousel, setup wizard flow and swatch grid.
extra = ["widgets", "viz", "dep:remedy-ui-widgets-extra"]
## Stage widgets (`remedy_ui::stage`) for whole alternative presentations: scenes with art
## and anchors, pixel-art sprites, orbits, path layouts, knobs and tuners, faders, timelines,
## big physical buttons and display boards.
stage = ["widgets", "viz", "dep:remedy-ui-widgets-stage"]
# Prism: .rfx effects (fire, water, glow, particles, 3D) as elements, on the GPU kernel or the CPU.
effects = ["dep:remedy-ui-effects", "dep:remedy-ui-media-effects"]
## Images (`remedy_ui::image`): PNG, JPEG, GIF, WebP, BMP and ICO, decoded off the UI
## thread at the size shown, color-managed and shared while in use.
image = ["dep:remedy-ui-media-image"]
## SVG (`remedy_ui::svg`): SVG files wherever images go, and tinted icons.
svg = ["image", "dep:remedy-ui-media-svg"]
## Animated images (`remedy_ui::anim`): GIF, APNG and animated WebP, played while seen.
anim = ["image", "dep:remedy-ui-media-anim"]
## Video surfaces (`remedy_ui::video`): frames from any thread, converted on the GPU.
video = ["dep:remedy-ui-media-video"]
## Web views (`remedy_ui::webview`): the platform's web view (WebView2, WebKitGTK) as an
## element, with an allow-list for every navigation and one JSON message channel.
webview = ["dep:remedy-ui-embed-webview"]
## GPU embeds (`remedy_ui::gpu_embed`): the app's own wgpu rendering (a 3D preview, a game
## view) as an element, on the device RemedyUI's windows draw with.
gpu-embed = ["gpu", "dep:remedy-ui-embed-gpu"]
## Code (`remedy_ui::code`): code views with syntax colors from the theme, folding, diffs.
code = ["widgets", "dep:remedy-ui-doc-code"]
agents = ["widgets", "nav", "dep:remedy-ui-automation"]
markup = ["widgets", "dep:remedy-ui-rui"]
## Media playback (`remedy_ui::playback`): sound and video files and streams through the
## platform's decoders, kept in sync by the sound clock, with the `player` widget and
## captions. Wire its full-screen request to `Window::set_fullscreen`.
playback = ["widgets", "video", "dep:remedy-ui-media-playback"]
## Terminals (`remedy_ui::term`): VT and xterm emulation with scrollback, selection, links,
## input methods and true color; the app keeps the PTY.
term = ["widgets", "dep:remedy-ui-widgets-term"]
## Rich documents (`remedy_ui::rich`): Markdown, the rich text editor, the find bar.
rich = ["widgets", "dep:remedy-ui-doc-rich"]
## Paged documents (`remedy_ui::pages`): a page view with deep zoom from 1% to 6400%
## rendered off the UI thread, spreads, rotation, selection, search and thumbnails, over
## pages the app supplies (its PDF or e-book engine stays in the app).
pages = ["widgets", "dep:remedy-ui-doc-pages"]
## Spell checking (`remedy_ui::spell`): the platform's checker or Hunspell dictionaries.
spell = ["widgets", "dep:remedy-ui-services-spell"]
## Boards people arrange (`remedy_ui::board`), with sandboxed scripted widgets in the
## languages the board accepts (`remedy_ui::script` is the language-neutral interface).
board = ["data", "dep:remedy-ui-widgets-board", "dep:remedy-ui-script"]
## Scripted widgets people write by hand in Rhai (`remedy_ui::script_rhai`).
script-rhai = ["board", "dep:remedy-ui-script-rhai"]
## Scripted widgets compiled to WebAssembly, run by a pure-Rust interpreter
## (`remedy_ui::script_wasm`).
script-wasm = ["board", "dep:remedy-ui-script-wasm"]
## What people change about the app (`remedy_ui::customize`): their theme, shortcuts,
## toolbars and menus, and text, kept as readable files with undo and resets, and the editors
## for them; `App::customizations` keeps them in the app's data folder.
customize = ["forms", "nav", "i18n", "dep:remedy-ui-customize"]
## Localization (`remedy_ui::i18n`): Fluent messages, locale data, dates and exact numbers.
i18n = ["dep:remedy-ui-services-i18n"]
## Importing what a web version saved (`remedy_ui::webstorage`): a web view's localStorage
## (WebView2, Android System WebView, Chrome), read losslessly and read-only, or the page's
## own in a browser.
webstorage = ["dep:remedy-ui-services-webstorage"]
## `#[derive(Store)]` (`remedy_ui::Store`): field-level reactive stores.
macros = ["dep:remedy-ui-macros"]
## Images and animations decoded in a sandboxed helper process (`remedy_ui::isolated`), so a
## decoder that crashes, hangs or runs away with memory takes down only the helper.
isolated = ["image", "anim", "dep:remedy-ui-media-isolated"]
## Desktop services (`remedy_ui::desktop`): starting with the session, URL schemes
## (`App::on_url`), jump lists and recent files, power (`App::on_power`, keeping awake),
## showing files in the file manager and the user's usual folders.
desktop = ["dep:remedy-ui-services-desktop"]
## Signed updates from GitHub releases or a feed (`remedy_ui::update`).
update = ["widgets", "dep:remedy-ui-services-update"]
## The in-memory host for tests (`remedy_ui::headless`).
headless = ["dep:remedy-ui-bridge-headless"]
## Browser pages and PWAs (`remedy_ui::web`): `run` starts the app in the page on
## `wasm32-unknown-unknown`, where `AppConfig::web` says where it mounts. On other targets,
## only the module's types (`WebConfig`, `Mount`) and its documentation, with no web code.
web = ["dep:remedy-ui-bridge-web"]
## Every optional part of the engine.
full = ["gpu", "complex-scripts", "devtools", "system-fonts", "script-fonts", "widgets", "forms", "nav", "data", "viz", "image", "svg", "anim", "video", "code", "term", "rich", "pages", "spell", "board", "script-rhai", "script-wasm", "agents", "markup", "i18n", "update", "headless", "playback", "webview", "gpu-embed", "music", "extra", "stage", "effects", "customize", "web", "macros", "isolated", "webstorage", "desktop"]

[dependencies]
remedy-ui-a11y = { path = "../remedy-ui-a11y", version = "1.0.0-rc.1" }
remedy-ui-macros = { path = "../remedy-ui-macros", version = "1.0.0-rc.1", optional = true }
remedy-ui-media-isolated = { path = "../remedy-ui-media-isolated", version = "1.0.0-rc.1", optional = true }
remedy-ui-paint = { path = "../remedy-ui-paint", version = "1.0.0-rc.1" }
remedy-ui-compositor = { path = "../remedy-ui-compositor", version = "1.0.0-rc.1" }
remedy-ui-core = { path = "../remedy-ui-core", version = "1.0.0-rc.1" }
remedy-ui-fonts = { path = "../remedy-ui-fonts", version = "1.0.0-rc.1" }
remedy-ui-fonts-cjk = { path = "../remedy-ui-fonts-cjk", version = "1.0.0-rc.1", optional = true }
remedy-ui-host = { path = "../remedy-ui-host", version = "1.0.0-rc.1" }
remedy-ui-input = { path = "../remedy-ui-input", version = "1.0.0-rc.1" }
remedy-ui-layout = { path = "../remedy-ui-layout", version = "1.0.0-rc.1" }
remedy-ui-reactive = { path = "../remedy-ui-reactive", version = "1.0.0-rc.1", features = ["persist"] }
remedy-ui-render-cpu = { path = "../remedy-ui-render-cpu", version = "1.0.0-rc.1" }
remedy-ui-render-gpu = { path = "../remedy-ui-render-gpu", version = "1.0.0-rc.1", optional = true }
remedy-ui-customize = { path = "../remedy-ui-customize", version = "1.0.0-rc.1", optional = true }
remedy-ui-devtools = { path = "../remedy-ui-devtools", version = "1.0.0-rc.1", optional = true }
remedy-ui-trace = { path = "../remedy-ui-trace", version = "1.0.0-rc.1" }
remedy-ui-widgets-core = { path = "../remedy-ui-widgets-core", version = "1.0.0-rc.1", optional = true }
remedy-ui-widgets-forms = { path = "../remedy-ui-widgets-forms", version = "1.0.0-rc.1", optional = true }
remedy-ui-widgets-nav = { path = "../remedy-ui-widgets-nav", version = "1.0.0-rc.1", optional = true }
remedy-ui-widgets-data = { path = "../remedy-ui-widgets-data", version = "1.0.0-rc.1", optional = true }
remedy-ui-viz = { path = "../remedy-ui-viz", version = "1.0.0-rc.1", optional = true }
remedy-ui-widgets-music = { path = "../remedy-ui-widgets-music", version = "1.0.0-rc.1", optional = true }
remedy-ui-widgets-extra = { path = "../remedy-ui-widgets-extra", version = "1.0.0-rc.1", optional = true }
remedy-ui-widgets-stage = { path = "../remedy-ui-widgets-stage", version = "1.0.0-rc.1", optional = true }
remedy-ui-effects = { path = "../remedy-ui-effects", version = "1.0.0-rc.1", optional = true }
remedy-ui-media-effects = { path = "../remedy-ui-media-effects", version = "1.0.0-rc.1", optional = true, default-features = false }
remedy-ui-media-image = { path = "../remedy-ui-media-image", version = "1.0.0-rc.1", optional = true }
remedy-ui-media-svg = { path = "../remedy-ui-media-svg", version = "1.0.0-rc.1", optional = true }
remedy-ui-doc-code = { path = "../remedy-ui-doc-code", version = "1.0.0-rc.1", optional = true }
remedy-ui-automation = { path = "../remedy-ui-automation", version = "1.0.0-rc.1", optional = true }
remedy-ui-rui = { path = "../remedy-ui-rui", version = "1.0.0-rc.1", optional = true }
remedy-ui-widgets-term = { path = "../remedy-ui-widgets-term", version = "1.0.0-rc.1", optional = true }
remedy-ui-media-video = { path = "../remedy-ui-media-video", version = "1.0.0-rc.1", optional = true }
remedy-ui-embed-webview = { path = "../remedy-ui-embed-webview", version = "1.0.0-rc.1", optional = true }
remedy-ui-embed-gpu = { path = "../remedy-ui-embed-gpu", version = "1.0.0-rc.1", optional = true }
remedy-ui-media-anim = { path = "../remedy-ui-media-anim", version = "1.0.0-rc.1", optional = true }
remedy-ui-media-playback = { path = "../remedy-ui-media-playback", version = "1.0.0-rc.1", optional = true }
remedy-ui-doc-rich = { path = "../remedy-ui-doc-rich", version = "1.0.0-rc.1", optional = true }
remedy-ui-doc-pages = { path = "../remedy-ui-doc-pages", version = "1.0.0-rc.1", optional = true }
remedy-ui-services-spell = { path = "../remedy-ui-services-spell", version = "1.0.0-rc.1", optional = true }
remedy-ui-widgets-board = { path = "../remedy-ui-widgets-board", version = "1.0.0-rc.1", optional = true }
remedy-ui-script = { path = "../remedy-ui-script", version = "1.0.0-rc.1", optional = true }
remedy-ui-script-rhai = { path = "../remedy-ui-script-rhai", version = "1.0.0-rc.1", optional = true }
remedy-ui-script-wasm = { path = "../remedy-ui-script-wasm", version = "1.0.0-rc.1", optional = true }
remedy-ui-themes = { path = "../remedy-ui-themes", version = "1.0.0-rc.1", optional = true }
remedy-ui-services-update = { path = "../remedy-ui-services-update", version = "1.0.0-rc.1", optional = true }
remedy-ui-services-desktop = { path = "../remedy-ui-services-desktop", version = "1.0.0-rc.1", optional = true }
remedy-ui-services-i18n = { path = "../remedy-ui-services-i18n", version = "1.0.0-rc.1", optional = true }
remedy-ui-services-webstorage = { path = "../remedy-ui-services-webstorage", version = "1.0.0-rc.1", optional = true }
remedy-ui-bridge-headless = { path = "../remedy-ui-bridge-headless", version = "1.0.0-rc.1", optional = true }
# On every target for `remedy_ui::web`'s types (`WebConfig`, `Mount`, the file store) and its
# documentation; the browser bindings it starts apps with are its wasm32-only dependencies,
# so native builds pull in nothing of the web.
remedy-ui-bridge-web = { path = "../remedy-ui-bridge-web", version = "1.0.0-rc.1", optional = true }
remedy-ui-secure = { path = "../remedy-ui-secure", version = "1.0.0-rc.1" }
remedy-ui-style = { path = "../remedy-ui-style", version = "1.0.0-rc.1" }
remedy-ui-text = { path = "../remedy-ui-text", version = "1.0.0-rc.1" }
remedy-ui-tree = { path = "../remedy-ui-tree", version = "1.0.0-rc.1" }
remedy-ui-view = { path = "../remedy-ui-view", version = "1.0.0-rc.1" }

[target.'cfg(windows)'.dependencies]
remedy-ui-bridge-windows = { path = "../remedy-ui-bridge-windows", version = "1.0.0-rc.1" }

[target.'cfg(target_os = "macos")'.dependencies]
remedy-ui-bridge-macos = { path = "../remedy-ui-bridge-macos", version = "1.0.0-rc.1" }

[target.'cfg(all(unix, not(any(target_os = "macos", target_os = "ios", target_os = "android"))))'.dependencies]
remedy-ui-bridge-linux = { path = "../remedy-ui-bridge-linux", version = "1.0.0-rc.1" }

[target.'cfg(target_os = "android")'.dependencies]
remedy-ui-bridge-android = { path = "../remedy-ui-bridge-android", version = "1.0.0-rc.1" }


[dev-dependencies]
remedy-ui-bridge-headless = { path = "../remedy-ui-bridge-headless", version = "1.0.0-rc.1" }
remedy-ui-compositor = { path = "../remedy-ui-compositor", version = "1.0.0-rc.1" }
remedy-ui-render-cpu = { path = "../remedy-ui-render-cpu", version = "1.0.0-rc.1" }
remedy-ui-render-gpu = { path = "../remedy-ui-render-gpu", version = "1.0.0-rc.1" }
png = { version = "=0.18.1" }

[target.'cfg(windows)'.dev-dependencies]
remedy-ui-bridge-winit = { path = "../remedy-ui-bridge-winit", version = "1.0.0-rc.1" }

# Tests, examples and the guide's doctests build with every pack, so `cargo test` checks all of them.
[target.'cfg(not(any(target_os = "android", target_arch = "wasm32")))'.dev-dependencies]
remedy-ui = { path = ".", features = ["full"] }

# On Android and the web (linted, not tested there), the packs the tests and examples use; the
# packs that build C or C++ need toolchains those lints do not set up.
[target.'cfg(any(target_os = "android", target_arch = "wasm32"))'.dev-dependencies]
remedy-ui = { path = ".", features = ["customize", "markup", "macros", "agents", "headless", "data", "viz", "pages", "webstorage"] }

[lints]
workspace = true

# Prism effects are not in the smaller Android and web builds the examples are linted with.
[[example]]
name = "effects_gallery"
required-features = ["effects"]

[[example]]
name = "glass_and_shadows"
required-features = ["effects"]

[[test]]
name = "effects_markup"
required-features = ["effects", "markup"]
