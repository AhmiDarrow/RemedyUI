[package]
name = "remedy-ui-view"
description = "RemedyUI's view layer: elements with style, layout, text, paint and semantics, the frame pipeline that turns them into compositor layers, and input routing."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
# The engine's own words (`strings`): Fluent messages with CLDR plurals, the same versions
# the localization service uses.
fluent-bundle = "=0.16.0"
fluent-syntax = "=0.12.0"
intl-memoizer = "=0.5.3"
intl_pluralrules = "=7.0.2"
remedy-ui-core = { path = "../remedy-ui-core", version = "1.0.0-rc.1" }
remedy-ui-compositor = { path = "../remedy-ui-compositor", version = "1.0.0-rc.1" }
remedy-ui-paint = { path = "../remedy-ui-paint", version = "1.0.0-rc.1" }
remedy-ui-render-cpu = { path = "../remedy-ui-render-cpu", version = "1.0.0-rc.1" }
remedy-ui-text = { path = "../remedy-ui-text", version = "1.0.0-rc.1" }
stacker = "=0.1.25"
unic-langid = { version = "=0.9.6", features = ["likelysubtags"] }

[dev-dependencies]
remedy-ui-fonts = { path = "../remedy-ui-fonts", version = "1.0.0-rc.1", features = ["remedy-sans-ui", "scripts"] }

[lints]
workspace = true
